<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logi Nexo Desktop — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F0EC; --bg-2:#F6F5F2; --surface:#FFFFFF; --surface-2:#F3F2EF;
  --line:#DEDCD7; --line-2:#E9E7E3; --ink:#1C1B19; --ink-2:#6B6862; --ink-3:#A3A09A;
  --nav-active:#000; --nav-active-ink:#fff; --folder-back:#CDC9C5;
  --new-bg:#B6F39B; --new-ink:#1D3F0D; --scrim:rgba(112,109,103,.42);
  --hit:#FFF1B8; --toast:#1C1B19; --toast-ink:#fff;
  --shadow:0 18px 48px rgba(40,36,30,.14), 0 2px 6px rgba(40,36,30,.06);
  --shadow-s:0 4px 14px rgba(40,36,30,.08);
  --sans:"Figtree", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --ease:cubic-bezier(.22,.8,.18,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1917; --bg-2:#201F1D; --surface:#272623; --surface-2:#2F2E2B;
    --line:#3A3935; --line-2:#33322E; --ink:#F2F0EB; --ink-2:#ABA79F; --ink-3:#77736C;
    --nav-active:#F2F0EB; --nav-active-ink:#1A1917; --folder-back:#4A4844;
    --new-bg:#2F5A1E; --new-ink:#CFF7B9; --scrim:rgba(0,0,0,.5); --hit:#5A4A12;
    --toast:#F2F0EB; --toast-ink:#1A1917;
    --shadow:0 18px 48px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    --shadow-s:0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1917; --bg-2:#201F1D; --surface:#272623; --surface-2:#2F2E2B;
  --line:#3A3935; --line-2:#33322E; --ink:#F2F0EB; --ink-2:#ABA79F; --ink-3:#77736C;
  --nav-active:#F2F0EB; --nav-active-ink:#1A1917; --folder-back:#4A4844;
  --new-bg:#2F5A1E; --new-ink:#CFF7B9; --scrim:rgba(0,0,0,.5); --hit:#5A4A12;
  --toast:#F2F0EB; --toast-ink:#1A1917;
  --shadow:0 18px 48px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --shadow-s:0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:flex;height:100%;min-width:900px}
.nav{position:relative;width:118px;flex:0 0 118px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:36px 0 26px}
.lights{display:flex;gap:8px;align-self:flex-start;margin-left:22px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#FE5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.nav-items{position:relative;margin-top:62px;display:flex;flex-direction:column;gap:16px;width:100%;align-items:center}
.nav-ind{position:absolute;top:0;left:50%;width:36px;height:36px;margin-left:-18px;border-radius:10px;background:var(--nav-active);transition:transform .45s var(--ease),opacity .2s}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;width:84px;padding:0 0 4px;font-size:12.5px;color:var(--ink)}
.nav-btn .nic{width:36px;height:36px;display:grid;place-items:center;transition:color .3s}
.nav-btn .nic .ic{width:22px;height:22px}
.nav-btn[aria-current="page"] .nic{color:var(--nav-active-ink)}
.nav-btn:hover:not([aria-current="page"]) .nic{background:var(--line-2);border-radius:10px}
.rec-btn{margin-top:auto;width:56px;height:56px;border-radius:50%;background:var(--ink);transition:transform .2s var(--ease)}
.rec-btn:hover{transform:scale(1.06)}
main{position:relative;flex:1;min-width:0;height:100%}
.view{height:100%;overflow:auto;padding:68px 56px 56px}
.vh{font-size:20px;font-weight:400;margin:0 0 22px;letter-spacing:-.005em}

/* ---------- shared bits ---------- */
.tag{display:inline-block;background:var(--new-bg);color:var(--new-ink);font-size:11px;font-weight:500;padding:3px 9px;border-radius:7px}
.meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.meta .mi{display:inline-flex;align-items:center;gap:4px}
.meta .ic{width:13px;height:13px}
.avs{display:inline-flex}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#fff;border:1.5px solid var(--surface);margin-left:-6px}
.avs .av:first-child{margin-left:0}
.av.lg{width:30px;height:30px;font-size:12px;margin-left:-8px}
.appic{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;border:1px solid var(--line-2);flex:0 0 auto}
.appic svg{width:24px;height:24px}
.back{display:inline-flex;align-items:center;gap:12px;font-size:19px;padding:6px 8px 6px 4px}
.back .ic{width:18px;height:18px}
.round{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.round .ic{width:18px;height:18px}

/* ---------- today ---------- */
.view-today{display:flex;align-items:flex-start;padding:112px 80px 60px 150px}
.catchup{font-weight:400;font-size:clamp(40px,4.45vw,66px);line-height:1.205;letter-spacing:-.012em;max-width:16.5em;margin:0}
.catchup .greet{display:block}
.w{display:inline-block;white-space:pre}
.intro .w,.intro .pill{animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--d) * 22ms)}
@keyframes rise{from{opacity:0;transform:translateY(.28em);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.pill{position:relative;display:inline-grid;place-items:center;vertical-align:-.12em;width:1.48em;height:1.02em;border-radius:1em;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line);margin:0 .06em;transition:background .25s,box-shadow .25s,transform .35s var(--ease),opacity .25s}
.pill svg{width:.62em;height:.62em}
.pill .appimg{width:.6em;height:.6em}
.appimg{display:block;width:24px;height:24px;object-fit:contain}
.apill .appimg,.arow .appimg{width:24px;height:24px}
.sitem .appimg{width:22px;height:22px}
.asrc .appimg{width:20px;height:20px}
.pill .ic{stroke-width:1.7}
.pill:hover,.pill.active{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),var(--shadow-s);transform:translateY(-2px)}
.pill.active{z-index:21}
.catchup .txt{transition:color .3s}
.previewing .catchup .txt{color:var(--ink-2)}
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .28s ease;z-index:20}
.previewing #scrim{opacity:1}
#float{position:fixed;z-index:30;left:0;top:0;cursor:pointer}
#float[hidden]{display:none}

/* meeting preview card */
.mcard{width:330px;background:var(--surface);border-radius:32px;padding:26px 24px 30px;box-shadow:var(--shadow)}
.mcard h4{margin:0 0 6px;font-size:14px;font-weight:500}
.mcard .lg{margin-top:26px;font-size:17px;line-height:1.48}
.mcard .lg p{margin:0 0 1em}.mcard .lg p:last-child{margin:0}
.mcard .memo{font-family:var(--serif);font-size:19px;line-height:1.45;margin-top:20px}

/* action card */
.xcard{width:370px;background:var(--surface);border-radius:36px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;text-align:left}
.xhead{background:var(--surface-2);padding:18px 18px 18px;position:relative}
.xhead .round{position:absolute;right:16px;top:16px;background:var(--line-2)}
.xhead h3{margin:16px 0 8px;font-size:21px;font-weight:400;letter-spacing:-.005em}
.xsrc{display:flex;gap:22px;color:var(--ink-2);font-size:14px;align-items:center}
.xsrc span{display:inline-flex;gap:6px;align-items:center}
.xsrc .ic{width:15px;height:15px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;margin-top:8px;background:var(--surface)}
.chip .ic{width:11px;height:11px}
.xbody{padding:16px 18px 0;font-size:13px;line-height:1.6;color:var(--ink-2);height:180px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 62%,transparent 98%);mask-image:linear-gradient(#000 62%,transparent 98%)}
.xbody b{font-weight:400;color:var(--ink)}
.xbody .row{display:flex;align-items:center;gap:10px}
.xbody .note{margin-top:18px;color:var(--ink);white-space:pre-line}
.xfoot{padding:0 14px 14px;margin-top:-34px;position:relative}
.xbtn{width:100%;height:46px;border-radius:24px;background:var(--surface-2);border:1px solid var(--line);font-size:14.5px;transition:background .2s}
.xbtn:hover{background:var(--line-2)}

/* ---------- recordings: masonry ---------- */
.dd{position:relative;display:inline-block;margin:0 0 22px 16px}
.dd-btn{display:inline-flex;align-items:center;gap:10px;font-size:20px;letter-spacing:-.005em;padding:4px 6px;border-radius:10px}
.dd-btn:hover{background:var(--line-2)}
.dd-btn .ic{width:16px;height:16px;transition:transform .3s var(--ease)}
.dd.open .dd-btn .ic{transform:rotate(180deg)}
.dd-menu{position:absolute;left:0;top:calc(100% + 6px);z-index:15;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:6px;min-width:220px;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:12px 0;pointer-events:none;transition:opacity .18s,transform .28s var(--ease)}
.dd.open .dd-menu{opacity:1;transform:none;pointer-events:auto}
.dd-opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;border-radius:12px;font-size:14.5px;text-align:left}
.dd-opt:hover{background:var(--surface-2)}
.dd-opt .ic{width:16px;height:16px;opacity:0}
.dd-opt[aria-checked="true"] .ic{opacity:1}
.masonry{display:flex;gap:12px;align-items:flex-start;max-width:1180px;padding-right:64px}
.mcol{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.rcard{display:block;width:100%;text-align:left;background:var(--surface);border-radius:32px;padding:24px 22px 26px;cursor:pointer;transition:box-shadow .25s,transform .3s var(--ease)}
.rcard:hover{box-shadow:var(--shadow-s);transform:translateY(-2px)}
.rcard .tag{margin-bottom:12px}
.rtitle{margin:0 0 20px;font-size:17px;font-weight:500;line-height:1.3;letter-spacing:-.003em}
.memo-text{margin:4px 0 18px;font-family:var(--serif);font-size:18.5px;line-height:1.48;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.months{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--surface);border-radius:24px;padding:14px 6px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-s);z-index:4}
.months button{font-size:12.5px;color:var(--ink-3);padding:5px 10px;border-radius:12px;transition:color .2s}
.months button[aria-current="true"]{color:var(--ink)}
.months button:hover{color:var(--ink)}

/* ---------- recordings: split ---------- */
.view-split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;grid-template-rows:auto 1fr;gap:0 26px;padding:60px 36px 24px 50px;overflow:hidden}
.view-split .back{grid-column:1/-1;margin:0 0 12px 8px;justify-self:start}
.llist{overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 24px;min-height:0}
.litem{text-align:left;width:100%;border-radius:22px;border:1px solid var(--line);padding:16px 20px 18px;transition:background .25s,border-color .25s;background:transparent}
.litem:hover{background:var(--bg-2)}
.litem.sel{background:var(--surface);border-color:var(--surface)}
.litem .tag{margin-bottom:10px}
.litem h4{margin:0 0 10px;font-size:15.5px;font-weight:400;line-height:1.3}
.litem .lmemo{margin:0 0 10px;font-family:var(--serif);font-size:14.5px;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.litem .meta{font-size:11px}
.dcard{background:var(--surface);border-radius:34px;overflow:hidden;min-height:0;display:flex}
.dinner{overflow:auto;padding:56px 54px 40px;width:100%}
.dinner h2{margin:0 0 8px;font-size:17.5px;font-weight:400}
.dinner .meta{font-size:13.5px;gap:12px}
.dinner .meta .ic{width:16px;height:16px}
.lagom{display:block;text-align:left;margin:52px -18px 30px;padding:14px 18px;border-radius:20px;font-size:clamp(19px,1.7vw,24px);line-height:1.36;transition:background .25s;position:relative;max-width:36em}
.lagom p{margin:0 0 .95em}.lagom p:last-of-type{margin:0}
.lagom.memo-lg{font-family:var(--serif)}
.lagom:hover{background:var(--surface-2)}
.lagom-hint{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:13px;color:var(--ink-2);opacity:0;transform:translateY(4px);transition:opacity .25s,transform .3s var(--ease)}
.lagom:hover .lagom-hint,.lagom:focus-visible .lagom-hint{opacity:1;transform:none}
.lagom-hint .ic{width:14px;height:14px}
.apills{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.apill{display:flex;align-items:center;gap:12px;padding:4px 22px 4px 4px;border-radius:32px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),0 2px 6px rgba(40,36,30,.06);font-size:13.5px;min-width:360px;transition:transform .3s var(--ease),box-shadow .25s}
.apill:hover{transform:translateX(3px);box-shadow:inset 0 0 0 1px var(--ink-3),var(--shadow-s)}
.apill .appic{width:50px;height:50px;background:var(--surface-2);border:0}
.empty-note{font-size:13.5px;color:var(--ink-3)}

/* ---------- summary ---------- */
.view-summary{padding:56px 24px 0 24px;overflow:hidden}
.scard{position:relative;height:100%;background:var(--surface);border-radius:44px 44px 0 0;display:flex;flex-direction:column;overflow:hidden}
.stop{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 0 30px;flex:0 0 auto}
.sbody{flex:1;display:flex;min-height:0}
.swrap{position:relative;flex:1 1 auto;min-width:0}
.scol{height:100%;overflow:auto;padding:30px 40px 140px}
.sinner{max-width:690px;margin:0 auto;transition:max-width .5s var(--ease)}
.sinner h2{font-size:17.5px;font-weight:400;margin:0 0 8px}
.sinner .meta{font-size:13.5px;gap:12px}
.sinner .meta .ic{width:16px;height:16px}
.slagom{font-size:19.5px;line-height:1.38;margin:24px 0 0}
.slagom p{margin:0 0 1.05em}
.slagom.memo-lg{font-family:var(--serif)}
.ssec{border-top:1px solid var(--line);margin-top:42px;padding-top:42px}
.ssec h3{font-size:17px;font-weight:400;margin:0 0 30px}
.ssec h5{font-size:13.5px;font-weight:500;margin:0 0 16px}
.ssec p{font-family:var(--serif);font-size:15.5px;line-height:1.72;margin:0 0 22px;color:var(--ink)}
.ssec ul{margin:0;padding-left:30px;font-family:var(--serif);font-size:15.5px;line-height:2}
.cite{display:inline-flex;align-items:center;font-family:var(--sans);font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:9px;border:1px solid var(--line);margin-left:6px;vertical-align:1px;line-height:1.5;transition:background .2s,border-color .2s,color .2s}
.cite:hover{border-color:var(--ink-2)}
.cite.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.txpanel{position:relative;flex:0 0 0%;overflow:hidden;transition:flex-basis .55s var(--ease)}
.tx-open .txpanel{flex-basis:46%}
.txcard{position:absolute;top:0;bottom:0;right:22px;width:var(--txw,440px);border:1px solid var(--line);border-bottom:0;border-radius:38px 38px 0 0;background:var(--surface);display:flex;flex-direction:column;opacity:0;transform:translateX(30px);transition:opacity .35s ease,transform .55s var(--ease)}
.tx-open .txcard{opacity:1;transform:none;transition-delay:.06s}
.txhead{display:flex;justify-content:center;align-items:center;padding:24px 22px 14px;position:relative;font-size:15.5px}
.txhead .x{position:absolute;right:22px;top:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.txhead .x:hover{background:var(--surface-2)}
.txscroll{overflow:auto;padding:12px 36px 60px;flex:1;scroll-behavior:smooth}
.seg{padding:16px 14px;margin:0 -14px 10px;border-radius:18px;transition:background .6s ease}
.seg.hit{background:var(--hit)}
.seg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.spk{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 4px}
.spk i{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px}
.seg-t{font-size:11.5px;color:var(--ink-2)}
.seg p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.68}

/* folded action stack */
.astack{--h:58px;position:absolute;right:28px;bottom:28px;width:300px;height:calc(var(--h) + 16px);transition:height .45s var(--ease);z-index:5}
.astack:hover,.astack:focus-within{height:calc(var(--n) * (var(--h) + 8px) + 8px)}
.tx-open .astack{width:270px;right:20px}
.sitem{position:absolute;left:0;right:0;bottom:0;height:var(--h);display:flex;align-items:center;gap:10px;padding:0 16px 0 6px;border-radius:30px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),0 6px 18px rgba(40,36,30,.1);font-size:12.5px;text-align:left;z-index:calc(10 - var(--i));transform:translateY(calc(var(--i) * 7px)) scale(calc(1 - var(--i) * .045));transition:transform .45s var(--ease) calc(var(--i) * 25ms),box-shadow .25s}
.sitem .appic{width:44px;height:44px;background:var(--surface-2);border:0}
.sitem .appic svg{width:22px;height:22px}
.sitem .stxt{flex:1;transition:opacity .25s}
.sitem:not(:first-child) .stxt,.sitem:not(:first-child) .appic{opacity:0}
.astack:hover .sitem,.astack:focus-within .sitem{transform:translateY(calc(var(--i) * (var(--h) + 8px) * -1))}
.astack:hover .sitem .stxt,.astack:hover .sitem .appic,.astack:focus-within .sitem .stxt,.astack:focus-within .sitem .appic{opacity:1}
.sitem:hover{box-shadow:inset 0 0 0 1px var(--ink-3),0 8px 22px rgba(40,36,30,.14)}
.scount{position:absolute;right:12px;font-size:11px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:2px 8px;transition:opacity .2s}
.astack:hover .scount,.astack:focus-within .scount{opacity:0}

/* ---------- action page ---------- */
.view-action{padding:56px 24px 0;overflow:hidden}
.acard{height:100%;background:var(--surface);border-radius:44px 44px 0 0;display:flex;flex-direction:column;overflow:hidden}
.atop{display:flex;align-items:center;gap:14px;padding:20px 20px 0 30px}
.atop .sp{flex:1}
.save-state{font-size:12.5px;color:var(--ink-3);opacity:0;transition:opacity .3s}
.save-state.on{opacity:1}
.primary{height:52px;padding:0 34px;border-radius:28px;background:var(--surface-2);border:1px solid var(--line);font-size:14.5px;display:inline-flex;align-items:center;gap:8px;transition:background .2s}
.primary:hover{background:var(--line-2)}
.primary .ic{width:16px;height:16px}
.acontent{overflow:auto;flex:1;padding:24px 40px 80px}
.ainner{max-width:780px;margin:0 auto 0 calc(min(14vw,220px))}
.asrc{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2);margin-bottom:34px}
.asrc .appic{width:38px;height:38px}
.asrc .appic svg{width:20px;height:20px}
.asrc a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.asrc a:hover{text-decoration-color:var(--ink)}
.atitle{font-size:28px;font-weight:400;margin:0 0 30px;letter-spacing:-.01em}
.frow{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:14px;color:var(--ink-2)}
.frow .val{color:var(--ink)}
.ed{border-radius:8px;padding:2px 6px;margin:-2px -6px;outline:none;transition:background .2s,box-shadow .2s;min-width:2em}
.ed:hover{background:var(--surface-2)}
.ed:focus{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.abody{margin-top:34px;font-size:15.5px;line-height:1.7;white-space:pre-wrap;max-width:620px;min-height:120px;padding:10px 12px;margin-left:-12px}
.names{display:inline-flex;align-items:center;gap:10px}
.names span{font-size:14px;color:var(--ink)}
.todo{list-style:none;padding:0;margin:34px 0 0;max-width:560px}
.todo li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:15.5px}
.todo input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink);flex:0 0 auto}
.todo li.done .ed{color:var(--ink-3);text-decoration:line-through}
.addrow{margin-top:14px;font-size:14px;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;margin-left:-10px}
.addrow:hover{background:var(--surface-2);color:var(--ink)}
.addrow .ic{width:16px;height:16px}

/* ---------- actions list ---------- */
.cu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:990px;margin-bottom:64px}
.cu-grid .xcard{width:100%;box-shadow:var(--shadow-s);cursor:pointer;transition:box-shadow .3s,transform .35s var(--ease)}
.cu-grid .xcard:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.cu-grid .xbody{height:186px}
.alist{display:flex;flex-direction:column;gap:10px;max-width:990px}
.arow{display:flex;align-items:center;gap:14px;padding:4px 24px 4px 4px;border-radius:34px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;text-align:left;width:100%;transition:transform .3s var(--ease),box-shadow .25s}
.arow:hover{box-shadow:inset 0 0 0 1px var(--ink-3),var(--shadow-s)}
.arow .appic{width:54px;height:54px;background:var(--surface-2);border:0}
.arow .t{flex:1}
.arow .src{font-size:12.5px;color:var(--ink-3)}

/* ---------- folders ---------- */
.fwrap{container-type:inline-size;max-width:1068px}
.fgrid{--gap:22px;--cols:5;--rowh:calc((100cqw - (var(--cols) - 1) * var(--gap)) / var(--cols) * 203 / 196);position:relative;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:var(--rowh);grid-auto-flow:row dense;gap:var(--gap)}
.ftile{position:relative;border-radius:24px;transition:opacity .4s ease,filter .4s,transform .5s var(--ease);user-select:none;-webkit-user-select:none}
.fnew{background:var(--surface);display:grid;place-items:center}
.fnew .ic{width:26px;height:26px;stroke-width:1.4}
.fnew:hover{box-shadow:var(--shadow-s)}
.folder{cursor:pointer}
.folder svg.fs{position:absolute;inset:0;width:100%;height:100%}
.flabel{position:absolute;left:14px;bottom:14px;right:14px}
.fname{font-size:15.5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcount{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-2)}
.fcount .ic{width:15px;height:15px}
.fgrid.has-open .ftile:not(.is-open){opacity:.38}
.folder.is-open{filter:drop-shadow(0 8px 18px rgba(40,36,30,.1))}
.folder.drop-target{opacity:1 !important;transform:scale(1.08) !important;filter:drop-shadow(0 14px 28px rgba(40,36,30,.2));z-index:3}
.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.25)}}
.fpanel{position:relative;z-index:2;background:var(--bg-2);border:1px solid var(--line);border-radius:38px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;margin:-4px 0}
.fp-head{display:flex;align-items:center;gap:8px;padding:20px 24px 16px;border-bottom:1px solid var(--line);font-size:14px}
.fp-head .ic{width:19px;height:19px}
.fp-head .n{color:var(--ink-3);margin-left:auto;font-size:12.5px}
.fp-list{overflow:auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.fp-list .rcard{padding:20px 20px 22px;cursor:grab;touch-action:none}
.fp-list .rcard:active{cursor:grabbing}
.fp-list .rtitle{font-size:16px;margin-bottom:16px}
.fp-list .memo-text{font-size:16.5px;-webkit-line-clamp:4}
.fp-empty{padding:40px 30px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.6}
.rcard.dragging{opacity:.28}
.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.9;box-shadow:var(--shadow);margin:0;transition:none}
.fgrid.is-dragging .folder:not(.is-open):hover{opacity:.7}
.fgrid.has-open .ftile:not(.is-open){transform:scale(.955)}
.fgrid.has-open .ftile.is-under{opacity:.08;transform:scale(.9);filter:blur(1.5px)}
.fpanel.floating{position:absolute;margin:0;z-index:6;transition:opacity .25s ease}
.fpanel.tucked{opacity:0;pointer-events:none}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--toast);color:var(--toast-ink);padding:12px 14px 12px 20px;border-radius:24px;font-size:13.5px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--ease);z-index:80}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font-weight:600;padding:4px 8px;border-radius:10px;color:var(--toast-ink)}
#toast button:hover{background:rgba(128,128,128,.25)}
#toast button[hidden]{display:none}

/* ---------- view transitions ---------- */
::view-transition-group(*){animation-duration:.52s;animation-timing-function:cubic-bezier(.22,.8,.18,1)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:none;object-position:0 0}
::view-transition-image-pair(*){overflow:hidden;border-radius:30px}
::view-transition-old(root),::view-transition-new(root){height:auto;object-fit:fill}
::view-transition-image-pair(root){overflow:visible;border-radius:0}
::view-transition-old(root){animation:vt-fade-out .22s ease both}
::view-transition-new(root){animation:vt-fade-in .3s ease .05s both}
::view-transition-old(detail),::view-transition-old(action-page){animation:vt-fade-out .26s ease both}
::view-transition-new(detail),::view-transition-new(action-page){animation:vt-fade-in .36s ease .08s both}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-fade-in{from{opacity:0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>

const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const mmss2 = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function detailOf(rec){
  if (rec.rich) return {sections:SEC_R2, tx:TX_R2};
  if (rec.type === 'memo') {
    return {sections:[{h:'Notes', blocks:[{sub:'In your words', p:[[rec.memo, 5]]}]}], tx:[[5,0,rec.memo]]};
  }
  const acts = rec.actions.map(A);
  const tx = [
    [14,1,`Okay, let’s start. Today is about ${rec.title.toLowerCase()}.`],
    [48,2,rec.lagom[0]],
    [95,1,'That matches what I heard from the others. Anything we’re missing?'],
    [140,3,rec.lagom[1] || 'Not really, I think the direction is clear.'],
    [205,2,'Let’s write down who owns what before we go.'],
    [262,1, acts[0] ? `I can take that: ${acts[0].title.toLowerCase()}.` : 'I’ll write it up and share it after.'],
    [318,3,'Sounds good. Thanks, all.']
  ];
  const sections = [{h:'Overview', blocks:[{sub:'What happened', p:[[rec.lagom[0],48],[rec.lagom[1]||'',140]].filter(x=>x[0])}]}];
  sections.push({h:'Next steps', bullets: acts.length ? acts.map(a => [a.title, 262]) : [['Share the notes with the team', 262]]});
  return {sections, tx};
}

/* ---------------- helpers ---------------- */
function avatars(list, lg){
  const show = list.slice(0, 2), rest = list.length - show.length;
  return `<span class="avs">${show.map(k => `<span class="av${lg?' lg':''}" style="background:${PEOPLE[k].c}" title="${PEOPLE[k].n}">${PEOPLE[k].n[0]}</span>`).join('')}${rest>0?`<span class="av${lg?' lg':''}" style="background:#FF6A13">+${rest}</span>`:''}</span>`;
}
function recMeta(rec, opts = {}){
  return `<div class="meta"><span class="mi">${rec.type==='memo'?I.chat:I.mic}${fmtDate(rec.date)}</span><span class="mi">${I.folder}${esc(F(rec.folder).name)}</span>${rec.type==='meeting' && opts.people!==false ? avatars(rec.people) : ''}</div>`;
}
function vtName(kind, id, fallback){
  if (state.morph && state.morph.kind === kind && state.morph.id === id) return kind === 'rec' ? 'detail' : 'action-page';
  return fallback;
}
const vtAttr = (name, fallback) => `style="view-transition-name:${name}" data-vt="${fallback}"`;

/* ---------------- state + navigation ---------------- */
let state = {view:'today', filter:'all', recId:null, actId:null, morph:null};
let hist = [];
let introPlayed = false;

function go(next, opts = {}){
  const {push = true, morph = null, source = null} = opts;
  closeDropdown();
  const update = () => {
    hidePreview(true);
    if (push) hist.push({state:{...state, morph:null}, morph});
    state = {...state, ...next, morph};
    render();
  };
  if (!document.startViewTransition || reduce){ update(); state.morph = null; resetNames(); return; }
  if (source && morph) source.style.viewTransitionName = morph.kind === 'rec' ? 'detail' : 'action-page';
  const vt = document.startViewTransition(update);
  vt.finished.finally(() => { state.morph = null; resetNames(); });
}
function resetNames(){ $$('[data-vt]').forEach(el => el.style.viewTransitionName = el.dataset.vt); float.style.viewTransitionName = 'none'; }
function back(){
  const e = hist.pop();
  if (!e){
    const parent = {recording:{view:'recordings'}, summary:{view:'recordings'}, action:{view:'actions'}}[state.view] || {view:'today'};
    return go(parent, {push:false});
  }
  let morph = e.morph;
  if (morph && state.view === 'recording' && morph.kind === 'rec') morph = {...morph, id:state.recId};
  go(e.state, {push:false, morph});
}
function navTo(view){
  if (view === 'people'){ toast('People isn’t part of this prototype yet'); return; }
  if (view === state.view && !hist.length) return;
  hist = [];
  go({view, recId:null, actId:null, folderId:null}, {push:false});
}

/* ---------------- nav ---------------- */
const NAV = [['today','Today',I.today],['recordings','Recordings',I.rec],['actions','Actions',I.actions],['folders','Folders',I.folder],['people','People',I.people]];
const NAV_OF = {today:'today', recordings:'recordings', recording:'recordings', summary:'recordings', actions:'actions', action:'actions', folders:'folders'};
$('#navItems').insertAdjacentHTML('beforeend', NAV.map(([k,l,ic]) => `<button class="nav-btn" data-nav="${k}"><span class="nic">${ic}</span>${l}</button>`).join(''));
$('#navItems').addEventListener('click', e => { const b = e.target.closest('[data-nav]'); if (b) navTo(b.dataset.nav); });
function updateNav(){
  const cur = (state.folderId && ['recording','summary','action'].includes(state.view)) ? 'folders' : (NAV_OF[state.view] || 'today');
  let target;
  $$('.nav-btn').forEach(b => { const on = b.dataset.nav === cur; b.toggleAttribute('aria-current', false); if (on){ b.setAttribute('aria-current','page'); target = b; } });
  if (target) $('#navInd').style.transform = `translateY(${target.offsetTop}px)`;
}

/* ---------------- render ---------------- */
const main = $('#main');
function render(){
  const v = state.view;
  main.innerHTML =
    v === 'today' ? renderToday() :
    v === 'recordings' ? renderRecordings() :
    v === 'recording' ? renderSplit() :
    v === 'summary' ? renderSummary() :
    v === 'action' ? renderAction() :
    v === 'actions' ? renderActions() :
    v === 'folders' ? renderFolders() : '';
  updateNav();
  if (v === 'recordings') initMonths();
  if (v === 'folders') initFolders();

/* ---------- TODAY ---------- */
function greeting(){
  const h = new Date().getHours();
  return h < 5 ? 'Good evening' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}
function renderToday(){
  const parts = [
    {t:'Nexo Design sync'}, {p:'rec:r1', ic:I.mic, label:'Preview Nexo Design sync'}, {t:'is finished. Your'},
    {p:'act:a2', ic:APP.mail, label:'Preview the catch up email'}, {t:'email to Tianyi about the project timeline is drafted, and a workshop invite'},
    {p:'act:a1', ic:APP.cal, label:'Preview the workshop invite'}, {t:'for the team is ready to set up.'}
  ];

/* preview (floating card) */
const float = $('#float'), app = $('#app');
let pv = {key:null, hideT:null, anim:null};
function previewHTML(key){
  const [kind, id] = key.split(':');
  if (kind === 'rec'){
    const r = R(id);
    return `<article class="mcard"><h4>${esc(r.title)}</h4>${recMeta(r)}<div class="lg">${r.lagom.map(p=>`<p>${esc(p)}</p>`).join('')}</div></article>`;

}
function actionCard(a, {name, fallback}){
  const src = R(a.rec);

  if (a.app === 'mail') fields = `<div>Subject: <b>${esc(a.fields.Subject)}</b></div><div class="row" style="margin-top:4px">To: ${avatars(a.people)}</div><div class="note">${esc(a.body)}</div>`;

      <span class="chip">${I.folder}${esc(F(a.folder).name)}</span></div>

function showPreview(pill){
  clearTimeout(pv.hideT);
  const key = pill.dataset.pv;
  $$('.pill').forEach(p => p.classList.toggle('active', p === pill));
  app.classList.add('previewing'); document.body.classList.add('previewing');
  if (pv.hiding){ pv.anim.cancel(); pv.hiding = false; }
  if (pv.key === key && !float.hidden) return;
  pv.key = key;
  if (pv.anim) pv.anim.cancel();
  float.innerHTML = previewHTML(key);
  float.dataset.key = key;
  float.style.viewTransitionName = 'none';
  float.hidden = false;
  const pr = pill.getBoundingClientRect(), fr = float.firstElementChild.getBoundingClientRect();
  const mr = main.getBoundingClientRect();
  let left = pr.left + pr.width/2 - fr.width/2;
  left = Math.max(mr.left + 16, Math.min(left, innerWidth - fr.width - 16));
  let top = pr.bottom + 14;
  if (top + fr.height > innerHeight - 16) top = Math.max(16, pr.top - fr.height - 14);
  float.style.left = left + 'px'; float.style.top = top + 'px';
  const ox = pr.left + pr.width/2 - left, oy = (pr.top + pr.height/2) - top;
  float.style.transformOrigin = `${ox}px ${oy}px`;
  if (!reduce) pv.anim = float.animate([
    {opacity:0, transform:'scale(.35)', filter:'blur(6px)'},
    {opacity:1, transform:'scale(1.015)', filter:'blur(0)', offset:.7},
    {opacity:1, transform:'scale(1)', filter:'blur(0)'}
  ], {duration:420, easing:EASE});
}
function hidePreview(immediate){
  clearTimeout(pv.hideT);
  const done = () => { float.hidden = true; pv.key = null; pv.hiding = false; };
  app.classList.remove('previewing'); document.body.classList.remove('previewing');
  $$('.pill.active').forEach(p => p.classList.remove('active'));
  if (immediate || reduce || float.hidden){ done(); return; }
  if (pv.anim) pv.anim.cancel();
  const an = float.animate([{opacity:1, transform:'scale(1)'},{opacity:0, transform:'scale(.9)'}], {duration:170, easing:'ease-in', fill:'forwards'});
  pv.anim = an; pv.hiding = true;
  an.onfinish = () => { if (pv.anim === an){ done(); } an.cancel(); };
}
function scheduleHide(){ clearTimeout(pv.hideT); pv.hideT = setTimeout(() => hidePreview(false), 140); }
function openPreview(key){
  const [kind, id] = key.split(':');
  float.style.viewTransitionName = kind === 'rec' ? 'detail' : 'action-page';
  if (kind === 'rec') go({view:'recording', recId:id, folderId:null}, {morph:{kind:'rec', id}});
  else go({view:'action', actId:id}, {morph:{kind:'act', id}});
}
main.addEventListener('pointerover', e => { const p = e.target.closest('.pill'); if (p) showPreview(p); });
main.addEventListener('pointerout', e => { const p = e.target.closest('.pill'); if (p && !(e.relatedTarget && (p.contains(e.relatedTarget) || float.contains(e.relatedTarget)))) scheduleHide(); });
main.addEventListener('focusin', e => { const p = e.target.closest('.pill'); if (p) showPreview(p); });
main.addEventListener('focusout', e => { if (e.target.closest('.pill')) scheduleHide(); });
float.addEventListener('pointerenter', () => clearTimeout(pv.hideT));
float.addEventListener('pointerleave', scheduleHide);
float.addEventListener('click', e => {
  const pb = e.target.closest('[data-primary]');
  if (pb){ e.stopPropagation(); const a = A(pb.dataset.primary); toast(a.done); return; }
  if (float.dataset.key) openPreview(float.dataset.key);
});

function recCard(r, name, fallback){

  return `<article class="rcard ${r.type}" data-open-rec="${r.id}" tabindex="0" ${attrs}>
    ${r.isNew ? '<span class="tag">New</span>' : ''}

function dropdown(){

    <div class="dd-menu" role="menu">${Object.entries(FILTERS).map(([k,l]) => `<button class="dd-opt" role="menuitemradio" aria-checked="${state.filter===k}" data-filter="${k}">${l}${I.check}</button>`).join('')}</div></div>`;
}
function colCount(){ return main.clientWidth >= 1000 ? 3 : 2; }
function renderRecordings(){
  const n = colCount(), cols = Array.from({length:n}, () => ({h:0, html:[]}));
  filtered().forEach(r => {
    const est = r.type === 'memo' ? 280 : (r.title.length > 34 ? 170 : 145) + (r.isNew ? 34 : 0);

function initMonths(){
  const view = $('#recView'); if (!view) return;
  const onScroll = () => {
    const top = view.getBoundingClientRect().top + 80;
    let best = null, bestD = Infinity;
    $$('.rcard', view).forEach(c => { const d = Math.abs(c.getBoundingClientRect().top - top); if (d < bestD){ bestD = d; best = c; } });
    if (!best) return;
    const m = monthOf(R(best.dataset.openRec).date);
    $$('.months button').forEach(b => b.setAttribute('aria-current', b.dataset.month === m));

function closeDropdown(){ const dd = $('#dd'); if (dd){ dd.classList.remove('open'); $('.dd-btn', dd).setAttribute('aria-expanded','false'); } }

    <div class="atop"><button class="back" data-back>${I.back}Back</button><span class="sp"></span><span class="save-state" id="saveState">Saved</span><button class="primary" data-primary="${a.id}">${esc(a.primary)}</button></div>
    <div class="acontent"><div class="ainner">
      <div class="asrc"><span class="appic">${APP[a.app]}</span><span>From <a data-go-rec="${src.id}">${esc(src.title)}</a>, ${esc(a.time)}</span></div>
      <h1 class="atitle ed" contenteditable="true">${esc(a.title)}</h1>
      ${body}
    </div></div></div></section>`;
}
let saveT;
function initAction(){
  const ac = $('.acontent');
  ac.addEventListener('input', () => {
    const s = $('#saveState'); s.textContent = 'Editing…'; s.classList.add('on');
    clearTimeout(saveT); saveT = setTimeout(() => { s.textContent = 'Saved'; setTimeout(() => s.classList.remove('on'), 1400); }, 700);
  });
  ac.addEventListener('change', e => { if (e.target.matches('.todo input')) e.target.closest('li').classList.toggle('done', e.target.checked); });
}

/* ---------- ACTIONS LIST ---------- */
function renderActions(){
  const cu = ACTS.filter(a => a.catchup), rest = ACTS.filter(a => !a.catchup);
  return `<section class="view view-actions">
    <h2 class="vh">Catch Up (${cu.length})</h2>
    <div class="cu-grid">${cu.map(a => actionCard(a, {name:vtName('act', a.id, 'act-'+a.id), fallback:'act-'+a.id})).join('')}</div>
    <h2 class="vh">All</h2>
    <div class="alist">${rest.map(a => `<button class="arow" data-open-act="${a.id}" ${vtAttr(vtName('act', a.id, 'arow-'+a.id), 'arow-'+a.id)}><span class="appic">${APP[a.app]}</span><span class="t">${esc(a.title)}</span><span class="src">${esc(R(a.rec).title.length>32?R(a.rec).title.slice(0,30)+'…':R(a.rec).title)}</span></button>`).join('')}</div>
  </section>`;
}

/* ---------- FOLDERS ---------- */
const FOLDER_SVG = '<svg class="fs" viewBox="0 0 196 203" aria-hidden="true"><rect width="196" height="203" rx="24" fill="var(--folder-back)"/><path d="M0 34C0 19.6 11.6 8 26 8H76C82 8 86 10 90 14L96 20C100 24 104 26 110 26H172C185.3 26 196 36.7 196 50V179C196 192.3 185.3 203 172 203H24C10.7 203 0 192.3 0 179Z" fill="var(--surface)"/></svg>';
const countIn = fid => RECS.filter(r => r.folder === fid).length;
function folderTile(f){
  return `<div class="ftile folder" data-fid="${f.id}" tabindex="0" role="button" aria-label="${esc(f.name)}, ${countIn(f.id)} recordings">${FOLDER_SVG}
    <div class="flabel"><div class="fname">${esc(f.name)}</div><div class="fcount">${I.wave}<span>${countIn(f.id)}</span></div></div></div>`;
}
function renderFolders(){
  return `<section class="view view-folders"><h2 class="vh">Folders</h2>
    <div class="fwrap"><div class="fgrid" id="fgrid"><button class="ftile fnew" data-new-folder aria-label="New folder">${I.plus}</button>${FOLDERS.map(folderTile).join('')}</div></div>
  </section>`;
}
const fo = {open:null, panel:null, openT:null, closeT:null, drag:null, last:{x:0,y:0}};
function panelHTML(fid){
  const recs = RECS.filter(r => r.folder === fid);
  return `<div class="fp-head">${I.folder}${esc(F(fid).name)}<span class="n">${recs.length} recording${recs.length===1?'':'s'}</span></div>
    <div class="fp-list">${recs.length ? recs.map(r => recCard(r)).join('') : '<div class="fp-empty">No recordings here yet.<br>Drag one in from another folder.</div>'}</div>`;
}
function gridCols(grid){ return getComputedStyle(grid).gridTemplateColumns.split(' ').length; }
function openFloat(fid){
  const grid = $('#fgrid'); if (!grid) return;
  const tile = grid.querySelector(`.folder[data-fid="${fid}"]`); if (!tile) return;
  const cols = gridCols(grid), gap = parseFloat(getComputedStyle(grid).columnGap);
  const tl = tile.offsetLeft, tt = tile.offsetTop, tw = tile.offsetWidth, th = tile.offsetHeight;
  const col = Math.round(tl / (tw + gap)) + 1;
  const pw = tw * 2 + gap, ph = th * 3 + gap * 2;
  const right = col + 2 <= cols;
  const left = right ? tl + tw + gap : tl - gap - pw;
  const top = Math.max(0, Math.min(tt, grid.offsetHeight - ph));
  let panel = fo.panel;
  const isNew = !panel;
  const prev = panel ? {l:panel.offsetLeft, t:panel.offsetTop} : null;
  if (!panel){ panel = document.createElement('div'); panel.className = 'fpanel floating'; grid.appendChild(panel); bindPanel(panel); fo.panel = panel; }
  panel.classList.remove('tucked');
  if (panel.dataset.fid !== fid){ panel.innerHTML = panelHTML(fid); panel.dataset.fid = fid; }
  Object.assign(panel.style, {left:left+'px', top:top+'px', width:pw+'px', height:ph+'px'});
  grid.classList.add('has-open');
  $$('.ftile', grid).forEach(t => {
    const me = t === tile;
    t.classList.toggle('is-open', me);
    const under = !me && t.offsetLeft < left + pw && t.offsetLeft + t.offsetWidth > left && t.offsetTop < top + ph && t.offsetTop + t.offsetHeight > top;
    t.classList.toggle('is-under', under);
  });
  fo.open = fid;
  if (reduce) return;
  if (isNew){
    const ox = right ? 0 : pw, oy = Math.min(ph, Math.max(0, tt - top + th / 2));
    panel.style.transformOrigin = `${ox}px ${oy}px`;
    panel.animate([{opacity:0, transform:'scale(.82)'},{opacity:1, transform:'none'}], {duration:380, easing:EASE});
  } else if (prev && (prev.l !== left || prev.t !== top)){
    panel.animate([{transform:`translate(${prev.l-left}px,${prev.t-top}px)`},{transform:'none'}], {duration:400, easing:EASE});
    $('.fp-list', panel).animate([{opacity:.2},{opacity:1}], {duration:280, easing:'ease-out'});
  }
}
function closeFloat(){
  const grid = $('#fgrid'), panel = fo.panel;
  fo.panel = null; fo.open = null;
  if (grid){ grid.classList.remove('has-open'); $$('.ftile', grid).forEach(t => t.classList.remove('is-open', 'is-under')); }
  if (!panel) return;
  if (reduce){ panel.remove(); return; }
  panel.style.pointerEvents = 'none';
  const from = panel.classList.contains('tucked') ? 0 : 1;
  panel.animate([{opacity:from, transform:'none'},{opacity:0, transform:'scale(.9)'}], {duration:200, easing:'ease-in', fill:'forwards'}).onfinish = () => panel.remove();
}
function openFolder(fid){ openFloat(fid); }
function closeFolder(){ closeFloat(); }
function scheduleClose(){ clearTimeout(fo.closeT); fo.closeT = setTimeout(() => { if (!fo.drag) closeFolder(); }, 260); }
function initFolders(){
  const grid = $('#fgrid');
  fo.open = null; fo.panel = null; fo.drag = null;
  grid.addEventListener('pointerover', e => {
    if (fo.drag) return;
    const t = e.target.closest('.folder');
    if (t){
      clearTimeout(fo.closeT);
      if (fo.open !== t.dataset.fid){ clearTimeout(fo.openT); fo.openT = setTimeout(() => openFolder(t.dataset.fid), fo.open ? 150 : 70); }
      return;
    }
    if (e.target.closest('.fpanel')){ clearTimeout(fo.closeT); clearTimeout(fo.openT); }
  });
  grid.addEventListener('pointerout', e => {
    if (fo.drag) return;
    const to = e.relatedTarget;
    if (to && to.closest && (to.closest('.folder') || to.closest('.fpanel'))){ if (to.closest('.fpanel')) clearTimeout(fo.openT); return; }
    clearTimeout(fo.openT); scheduleClose();
  });
  grid.addEventListener('focusin', e => { const t = e.target.closest('.folder'); if (t && fo.open !== t.dataset.fid) openFolder(t.dataset.fid); });
  grid.addEventListener('click', e => {
    if (e.target.closest('[data-new-folder]')) newFolder();
  });
}
function newFolder(){
  const id = 'f' + Date.now();
  FOLDERS.push({id, name:'New folder'});
  const grid = $('#fgrid');
  closeFolder();
  grid.insertAdjacentHTML('beforeend', folderTile(F(id)));
  const t = grid.lastElementChild;
  if (!reduce) t.animate([{opacity:0, transform:'scale(.8)'},{opacity:1, transform:'none'}], {duration:420, easing:EASE});
  toast('Folder created');
}
function bindPanel(panel){
  panel.addEventListener('pointerdown', e => {
    const card = e.target.closest('.rcard');
    if (!card || e.button !== 0) return;
    e.preventDefault();
    const start = {x:e.clientX, y:e.clientY}, rect = card.getBoundingClientRect();
    let ghost = null, target = null;
    const move = ev => {
      fo.last = {x:ev.clientX, y:ev.clientY};
      if (!ghost){
        if (Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 6) return;
        ghost = card.cloneNode(true); ghost.classList.add('ghost'); ghost.removeAttribute('style');
        Object.assign(ghost.style, {left:rect.left+'px', top:rect.top+'px', width:rect.width+'px'});
        document.body.appendChild(ghost);
        card.classList.add('dragging');
        fo.drag = {rid:card.dataset.openRec, from:panel.dataset.fid};
        clearTimeout(fo.closeT); clearTimeout(fo.openT);
        $('#fgrid').classList.add('is-dragging');
        if (panel.classList.contains('floating')){ panel.classList.add('tucked'); $$('.ftile.is-under').forEach(t => t.classList.remove('is-under')); }
      }
      ghost.style.transform = `translate(${ev.clientX-start.x}px,${ev.clientY-start.y}px) rotate(-1.5deg) scale(1.02)`;
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const t = el && el.closest('.folder');
      const valid = t && t.dataset.fid !== fo.drag.from ? t : null;
      if (valid !== target){ if (target) target.classList.remove('drop-target'); target = valid; if (target) target.classList.add('drop-target'); }
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      if (!ghost){ openRecFromCard(card); return; }
      const g = ghost, rid = fo.drag.rid, from = fo.drag.from;
      $('#fgrid').classList.remove('is-dragging');
      if (target){
        const tr = target.getBoundingClientRect(), to = target.dataset.fid;
        target.classList.remove('drop-target');
        const tx = tr.left + tr.width/2 - (rect.left + rect.width/2), ty = tr.top + tr.height/2 - (rect.top + rect.height/2);
        g.animate([{transform:g.style.transform, opacity:.9},{transform:`translate(${tx}px,${ty}px) scale(.12)`, opacity:0}], {duration:380, easing:EASE, fill:'forwards'}).onfinish = () => g.remove();
        moveRec(rid, from, to, card, true);
        if (panel.classList.contains('floating')) setTimeout(closeFolder, 120);
      } else {
        g.animate([{transform:g.style.transform},{transform:'translate(0,0)'}], {duration:300, easing:EASE, fill:'forwards'}).onfinish = () => { g.remove(); card.classList.remove('dragging'); };
        if (panel.classList.contains('floating') && fo.panel === panel) openFloat(panel.dataset.fid);
      }
      fo.drag = null;
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      if (!(el && (el.closest('.fpanel') || el.closest('.folder.is-open')))) scheduleClose();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
}
function refreshCounts(){
  $$('.folder').forEach(t => { const n = countIn(t.dataset.fid); $('.fcount span', t).textContent = n; });
  if (fo.panel){ const h = $('.fp-head .n', fo.panel); const n = countIn(fo.panel.dataset.fid); if (h) h.textContent = `${n} recording${n===1?'':'s'}`; }
}
function moveRec(rid, from, to, card, undoable){
  R(rid).folder = to;
  if (card){
    const h = card.offsetHeight;
    card.style.overflow = 'hidden';
    const done = () => { card.remove(); if (fo.panel && !$('.rcard', fo.panel)) $('.fp-list', fo.panel).innerHTML = '<div class="fp-empty">No recordings here yet.<br>Drag one in from another folder.</div>'; };
    if (reduce) done();
    else card.animate([{height:h+'px', opacity:.28, marginBottom:'0px'},{height:'0px', opacity:0, paddingTop:'0px', paddingBottom:'0px', marginBottom:'-8px'}], {duration:320, easing:EASE, fill:'forwards'}).onfinish = done;
  }
  refreshCounts();
  const t = $(`.folder[data-fid="${to}"] .fcount`);
  if (t && !reduce){ t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump'); }
  if (undoable) toast(`Moved to ${F(to).name}`, () => {
    R(rid).folder = from; refreshCounts();
    if (fo.panel && fo.panel.dataset.fid === from){ fo.panel.innerHTML = panelHTML(from); }
  });
}
function openRecFromCard(card){
  const id = card.dataset.openRec;
  clearTimeout(fo.closeT);
  const panel = card.closest('.fpanel');
  go({view:'recording', recId:id, folderId: panel ? panel.dataset.fid : R(id).folder}, {morph:{kind:'rec', id}, source:card});
}

/* ---------------- delegated clicks ---------------- */
main.addEventListener('click', e => {
  const t = e.target;
  if (state.view === 'folders') return; // handled by folder logic
  if (t.closest('[data-back]')) return back();
  const dd = t.closest('[data-dd]');
  if (dd){ const box = $('#dd'); const open = !box.classList.contains('open'); box.classList.toggle('open', open); dd.setAttribute('aria-expanded', open); return; }
  const fl = t.closest('[data-filter]');
  if (fl){ closeDropdown(); if (fl.dataset.filter !== state.filter) go({filter:fl.dataset.filter}, {push:false}); return; }
  const mo = t.closest('[data-month]');
  if (mo){
    const first = filtered().find(r => monthOf(r.date) === mo.dataset.month);
    const el = first && $(`.rcard[data-open-rec="${first.id}"]`);
    const view = $('#recView');
    if (el) view.scrollTo({top: view.scrollTop + el.getBoundingClientRect().top - view.getBoundingClientRect().top - 24, behavior: reduce ? 'auto' : 'smooth'});
    return;
  }
  const pill = t.closest('.pill');
  if (pill){ openPreview(pill.dataset.pv); return; }
  const pr = t.closest('[data-primary]');
  if (pr){ e.stopPropagation(); const a = A(pr.dataset.primary); toast(a.done); if (state.view === 'action'){ pr.innerHTML = `${I.check}${esc(a.done)}`; } return; }
  const rc = t.closest('[data-open-rec]');
  if (rc){ const id = rc.dataset.openRec; go({view:'recording', recId:id, folderId:null}, {morph:{kind:'rec', id}, source:rc}); return; }
  const pk = t.closest('[data-pick]');
  if (pk){ pickRec(pk.dataset.pick); return; }
  if (t.closest('[data-open-summary]')){ go({view:'summary', recId:state.recId}, {morph:{kind:'rec', id:state.recId}}); return; }
  const ci = t.closest('[data-cite]');
  if (ci){ openTranscript(Number(ci.dataset.cite), ci); return; }
  if (t.closest('[data-tx-close]')){ closeTranscript(); return; }
  if (t.closest('[data-more]')){ toast('More options aren’t part of this prototype'); return; }
  const oa = t.closest('[data-open-act]');
  if (oa){ const id = oa.dataset.openAct; go({view:'action', actId:id}, {morph:{kind:'act', id}, source:oa}); return; }
  const gr = t.closest('[data-go-rec]');
  if (gr){ const id = gr.dataset.goRec; go({view:'summary', recId:id}, {morph:{kind:'rec', id}}); return; }
  if (t.closest('[data-add-item]')){
    const ul = $('#todo'); ul.insertAdjacentHTML('beforeend', '<li><input type="checkbox" aria-label="Done"><span class="ed" contenteditable="true"></span></li>');
    const ed = ul.lastElementChild.querySelector('.ed'); ed.focus();
    if (!reduce) ul.lastElementChild.animate([{opacity:0, transform:'translateY(-6px)'},{opacity:1, transform:'none'}], {duration:300, easing:EASE});
  }
});
main.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.rcard[data-open-rec]') && state.view === 'recordings'){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (!float.hidden) hidePreview(false);
    else if ($('#sbody.tx-open')) closeTranscript();
    else closeDropdown();
  }
});

/* ---------------- toast ---------------- */
let toastT;
function toast(msg, undo){
  const el = $('#toast'), b = $('#toastUndo');
  $('#toastMsg').textContent = msg;
  b.hidden = !undo;
  b.onclick = () => { if (undo) undo(); el.classList.remove('on'); };
  el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), undo ? 4200 : 2200);
}

/* ---------------- resize ---------------- */
let lastCols = null;
addEventListener('resize', () => {
  updateNav();
  if (state.view === 'recordings'){ const c = colCount(); if (c !== lastCols){ lastCols = c; render(); } }
  if (state.view === 'summary') initSummary();
});

render();
lastCols = colCount();
requestAnimationFrame(updateNav);
})();
</script>
