<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logi Nexo Desktop — Multi-view prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
/* ===== Nexo DS tokens ===== */
:root{
  --bg-canvas:#E5E2E0; --bg-surface:#FFFFFF; --bg-subtle:#F5F4F2; --bg-pressed:#E5E2E0; --bg-inverse:#1B1B1B; --bg-overlay:rgba(0,0,0,.2);
  --text-primary:#1B1B1B; --text-secondary:#343331; --text-tertiary:#555451; --text-disabled:#BEBDBB; --text-inverse:#FFFFFF;
  --border-subtle:#E5E2E0; --border-default:#D9D6D4; --border-strong:#A19F9A; --border-surface:#FFFFFF;
  --icon-primary:#1B1B1B; --icon-secondary:#343331; --icon-inverse:#FFFFFF; --icon-disabled:#BEBDBB;
  --accent-blue:#3A39FF; --accent-orange:#FF6D0F; --accent-green:#00A834; --accent-tomato:#E84A1F; --accent-lime:#B1FF99; --on-accent:#1B1B1B;
  --hover:rgba(27,27,27,.05);
  --shadow-xs:0 4px 12px rgba(0,0,0,.06);
  --shadow-s:0 8px 16px 5px rgba(0,0,0,.02);
  --shadow-xl:0 11px 25px rgba(0,0,0,.08),0 46px 46px rgba(0,0,0,.07),0 103px 62px rgba(0,0,0,.04),0 183px 73px rgba(0,0,0,.01);
  --shadow-edge:0 1px 0 var(--border-subtle);
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-2xl:32px; --r-menu:36px; --r-3xl:40px; --r-full:999px;
  --sp-2xs:2px; --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:24px; --sp-2xl:32px; --sp-3xl:40px; --sp-4xl:48px;
  --sans:"Figtree","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.22,.8,.18,1); --dur:.46s;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-canvas:#1B1B1B; --bg-surface:#252422; --bg-subtle:#343331; --bg-pressed:#555451; --bg-inverse:#F5F4F2; --bg-overlay:rgba(0,0,0,.48);
    --text-primary:#F5F4F2; --text-secondary:#C7C4C3; --text-tertiary:#A19F9A; --text-disabled:#7E7C78; --text-inverse:#1B1B1B;
    --border-subtle:#343331; --border-default:#555451; --border-strong:#7E7C78; --border-surface:#252422;
    --icon-primary:#F5F4F2; --icon-secondary:#BEBDBB; --icon-inverse:#1B1B1B; --icon-disabled:#7E7C78;
    --hover:rgba(255,255,255,.06);
    --shadow-xs:0 4px 12px rgba(0,0,0,.3); --shadow-s:0 8px 16px 5px rgba(0,0,0,.18);
    --shadow-xl:0 11px 25px rgba(0,0,0,.4),0 46px 46px rgba(0,0,0,.3),0 103px 62px rgba(0,0,0,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-canvas:#1B1B1B; --bg-surface:#252422; --bg-subtle:#343331; --bg-pressed:#555451; --bg-inverse:#F5F4F2; --bg-overlay:rgba(0,0,0,.48);
  --text-primary:#F5F4F2; --text-secondary:#C7C4C3; --text-tertiary:#A19F9A; --text-disabled:#7E7C78; --text-inverse:#1B1B1B;
  --border-subtle:#343331; --border-default:#555451; --border-strong:#7E7C78; --border-surface:#252422;
  --icon-primary:#F5F4F2; --icon-secondary:#BEBDBB; --icon-inverse:#1B1B1B; --icon-disabled:#7E7C78;
  --hover:rgba(255,255,255,.06);
  --shadow-xs:0 4px 12px rgba(0,0,0,.3); --shadow-s:0 8px 16px 5px rgba(0,0,0,.18);
  --shadow-xl:0 11px 25px rgba(0,0,0,.4),0 46px 46px rgba(0,0,0,.3),0 103px 62px rgba(0,0,0,.2);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg-canvas);color:var(--text-primary);font-family:var(--sans);font-size:14px;line-height:17px;overflow:auto;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px}

.app{position:absolute;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:0;right:0;min-width:1040px;min-height:620px;display:flex;overflow:hidden;background:var(--bg-canvas)}

/* ---------- rail (nav) ---------- */
.rail{width:86px;flex:none;display:flex;flex-direction:column;align-items:center;position:relative;z-index:3}
.lights{position:absolute;top:26px;left:16px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.nav{margin-top:72px;display:flex;flex-direction:column;gap:var(--sp-sm)}
.nav-i{width:66px;height:58px;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-xs);font-size:10px;line-height:12px;font-weight:500;color:var(--text-primary);transition:background .2s,color .2s}
.nav-i .ico{width:24px;height:24px;display:grid;place-items:center}
.nav-i .ico svg{width:24px;height:24px}
.nav-i.on{background:var(--bg-inverse);color:var(--text-inverse)}
.nav-i:not(.on):hover{background:var(--hover)}
.me{margin-top:auto;margin-bottom:var(--sp-xl);width:48px;height:48px;border-radius:50%;background:var(--bg-inverse)}

/* ---------- icon buttons (DS round) ---------- */
.ib{width:32px;height:32px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--icon-primary);flex:none;transition:background .15s}
.ib:hover{background:var(--hover)}
.ib:active{background:var(--bg-pressed)}
.ib:disabled{color:var(--icon-disabled);cursor:default;background:none}
.ib.contained{width:40px;height:40px;background:var(--bg-subtle)}
.ib.contained:hover{background:var(--bg-pressed)}

/* ---------- sidebar ---------- */
.sb-toggle{position:absolute;left:96px;top:16px;z-index:9;width:32px;height:32px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--icon-primary);transition:background .15s}
.sb-toggle:hover{background:var(--hover)}
.sb-toggle svg{width:20px;height:20px}
.sidebar{flex:none;width:218px;border-right:1px solid transparent;overflow:hidden;position:relative;transition:width var(--dur) var(--ease),border-color .3s}
.app.sb-closed .sidebar{border-right-color:transparent}
.sidebar-inner{position:absolute;top:0;bottom:0;left:0;width:100%;min-width:190px;display:flex;flex-direction:column;container:side/inline-size;transition:opacity .28s ease}
.app.sb-closed .sidebar-inner{opacity:0}
.side-top{height:56px;flex:none}
.side-list{flex:1;overflow:auto;position:relative;padding:var(--sp-sm) var(--sp-sm) var(--sp-2xl);scrollbar-width:thin}
.sel{position:absolute;left:var(--sp-sm);right:var(--sp-sm);top:0;height:36px;border-radius:var(--r-md);background:var(--bg-surface);box-shadow:var(--shadow-edge);transition:transform .42s var(--ease),opacity .25s;pointer-events:none;z-index:0}
.grp{position:relative;z-index:1}
.grp+.grp{border-top:1px solid var(--border-default);margin-top:var(--sp-md);padding-top:var(--sp-md)}
.grp-l{font-size:12px;line-height:14px;color:var(--text-tertiary);padding:var(--sp-xs) var(--sp-md) var(--sp-sm)}
.row{display:flex;align-items:center;gap:var(--sp-sm);width:100%;height:36px;padding:0 var(--sp-md);border-radius:var(--r-md);text-align:left;font-size:14px;line-height:17px;color:var(--text-primary);position:relative;transition:background .15s,opacity .25s}
.row:hover:not(.on){background:var(--hover)}
.row svg{width:16px;height:16px;color:var(--icon-secondary)}
.r-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new{font-size:10px;line-height:12px;font-weight:500;background:var(--accent-lime);color:var(--on-accent);padding:var(--sp-2xs) 6px;border-radius:var(--r-xs);flex:none}
.r-time{display:none;font-size:12px;line-height:14px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;flex:none}
.r-dot{width:6px;height:6px;border-radius:50%;background:var(--border-strong);flex:none;opacity:0;transform:scale(.4);transition:opacity .25s,transform .3s var(--ease)}
.row.open .r-dot{opacity:1;transform:none}
.row.ctx-on{box-shadow:inset 0 0 0 1px var(--border-strong)}
@container side (min-width:270px){.r-time{display:block}}
@container side (max-width:205px){.new{display:none}}

/* ---------- workspace + panes ---------- */
.workspace{flex:1;min-width:0;display:flex;position:relative;background:var(--bg-canvas)}
.pane{flex:none;width:100%;container:pane/inline-size;display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;background:transparent;transition:width var(--dur) var(--ease),opacity .3s}
.pane+.pane{border-left:1px solid var(--border-subtle)}
.pane.will-close{opacity:.45}
.tabbar{height:56px;flex:none;display:flex;align-items:stretch;background:var(--bg-canvas);padding-left:0;transition:padding-left var(--dur) var(--ease)}
.workspace.multi .tabbar{padding-left:5px}
.workspace.multi .pane.first .tabbar{padding-left:var(--sp-sm)}
.pane:has(.tab:first-child.on) .pbody{border-top-left-radius:0!important}
.app.sb-closed .pane.first .pbody{border-top-left-radius:var(--r-xl)!important}
.app.sb-closed .pane.first .tabbar{padding-left:52px!important}
.tb-back{display:none!important}
.tabs{display:flex;align-items:stretch;min-width:0;flex:0 1 auto;overflow:hidden;padding-top:var(--sp-sm)}
.tab{display:flex;align-items:center;gap:var(--sp-sm);padding:0 var(--sp-sm) 0 var(--sp-lg);flex:0 1 240px;min-width:72px;max-width:240px;font-size:14px;line-height:17px;color:var(--text-tertiary);position:relative;cursor:default;border-radius:var(--r-lg) var(--r-lg) 0 0;transition:background .2s,color .2s}
.tab:hover:not(.on){background:var(--hover)}
.tab.on{background:var(--bg-surface);color:var(--text-primary)}
.tab svg{width:16px;height:16px}
.t-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-x{width:24px;height:24px;border-radius:var(--r-full);display:grid;place-items:center;opacity:0;flex:none;transition:opacity .15s,background .15s}
.t-x svg{width:14px;height:14px}
.tab:hover .t-x,.tab.on .t-x{opacity:1}
.t-x:hover{background:var(--hover)}
.workspace.solo .t-x{display:none}
.workspace.solo .tab{padding-right:var(--sp-lg)}
.tb-sp{flex:1}
.tb-more{align-self:flex-end;margin:0 var(--sp-md) var(--sp-sm) 0}
.focus-bar{display:none}
@container pane (max-width:560px){
  .tab:not(.on){flex:none;min-width:0;padding:0 var(--sp-md)}
  .tab:not(.on) .t-l,.tab:not(.on) .t-x{display:none}
  .tab.on{min-width:110px}
  .tb-back{margin:0 2px var(--sp-sm) 6px}
  .tb-more{margin:0 var(--sp-sm) var(--sp-sm) 0}
}

/* multi-window: each window is its own card on the canvas */
.workspace.multi .pane{background:transparent;border-left:0}
.workspace.multi .tabbar{position:relative;z-index:3}
.workspace.multi .pbody{margin:0 5px var(--sp-sm);background:var(--bg-surface);border:0;border-radius:var(--r-xl);overflow:hidden;transition:box-shadow .3s}
.workspace.multi .pane.first .pbody{margin-left:var(--sp-sm)}
.workspace.multi .pane.focus .pbody{box-shadow:var(--shadow-s)}
.workspace.multi .tab.on{z-index:2}

.workspace.multi .pane:not(.focus) .tab.on .t-l{color:var(--text-tertiary)}
.workspace.multi .pane:not(.focus) .c-sum{opacity:.8;transition:opacity .3s}
.workspace.multi .pane.focus .c-sum{opacity:1;transition:opacity .3s}

.pbody{flex:1;min-height:0;display:flex;position:relative;background:var(--bg-surface);border-radius:var(--r-xl) var(--r-xl) 0 0;margin-right:var(--sp-sm);overflow:hidden}
.col{position:relative;height:100%;min-width:0;flex:none;transition:width var(--dur) var(--ease)}
.c-sum{flex:1 1 0;overflow:auto;container:sum/inline-size;scrollbar-width:thin}
.c-tr{width:0;overflow:hidden}
.c-act{width:80px}
body.dragging:not(.snapping) .col,
body.dragging:not(.snapping) .pane,
body.dragging:not(.snapping) .sidebar,
body.dragging:not(.snapping) .act-panel,
body.dragging:not(.snapping) .tabbar,
body.dragging:not(.snapping) .g-act{transition:none!important}
body.dragging,body.dragging *{cursor:col-resize!important;user-select:none}
.pane.snap .col,.pane.snap .act-panel{transition:width .4s var(--ease)!important}
body.resizing .g-act,body.resizing .col,body.resizing .pane,body.resizing .sidebar,body.resizing .act-panel{transition:none!important}

/* resizers */
.rz{flex:none;width:0;position:relative;z-index:7}
.rz::before{content:"";position:absolute;top:0;bottom:0;left:-6px;width:12px;cursor:col-resize}
.rz::after{content:"";position:absolute;top:var(--sp-xl);bottom:var(--sp-xl);left:-1px;width:2px;border-radius:2px;background:var(--border-strong);opacity:0;transform:scaleY(.7);transition:opacity .18s ease 0s,transform .3s var(--ease) 0s,background .2s}
.rz:hover::after{opacity:1;transform:none;transition-delay:.12s}
.rz.active::after{opacity:1;transform:none;background:var(--text-tertiary);transition-delay:0s}
.rz-t{display:none}
.pane.tr-open .rz-t{display:block}
.a-ov .rz-a{display:none}
.rz-p{position:absolute;left:0;top:0;bottom:0;width:0}
.rz-p::after{top:64px;bottom:var(--sp-xl);left:-1px}
.rz-s{position:absolute;left:0;top:0;bottom:0;width:0}
.rz-s::after{top:0;bottom:0}

/* ---------- summary doc ---------- */
.doc{padding:var(--sp-4xl) clamp(24px,7cqi,64px) 140px;max-width:1120px}
.d-head h1{font-size:clamp(24px,3.4cqi,28px);line-height:1.215;font-weight:400;letter-spacing:-.02em;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-sm) var(--sp-lg);margin-top:var(--sp-md);font-size:14px;line-height:17px;color:var(--text-secondary)}
.meta>span{display:inline-flex;align-items:center;gap:var(--sp-xs);white-space:nowrap}
.meta svg{width:16px;height:16px;color:var(--icon-secondary)}
.avs{display:inline-flex;align-items:center}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;line-height:1;font-weight:500;color:var(--f,#fff);background:var(--c,#777);box-shadow:0 0 0 1.5px var(--border-surface);flex:none}
.avs .av+.av{margin-left:-6px}
.av.more{background:var(--accent-orange);color:var(--on-accent)}
.lbl{font-size:10px;line-height:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);margin:0 0 var(--sp-md)}
.d-sum{margin-top:var(--sp-3xl)}
.lede{font-size:clamp(17px,2.3cqi,22px);line-height:1.364;margin:0;max-width:60ch;text-wrap:pretty}
.secs{margin-top:var(--sp-sm)}
.d-sec{margin-top:var(--sp-2xl)}
.pts{list-style:none;margin:0;padding:0}
.pt{display:grid;grid-template-columns:1fr auto;align-items:start;gap:0 var(--sp-lg);padding:0 0 0 20px;position:relative;font-family:var(--serif);font-weight:300;font-size:16px;line-height:30px;letter-spacing:.01em;max-width:780px}
.pt::before{content:"";position:absolute;left:5px;top:13px;width:4px;height:4px;border-radius:50%;background:var(--text-primary)}
.cite{font-family:var(--sans);font-size:12px;line-height:14px;font-variant-numeric:tabular-nums;height:24px;padding:0 var(--sp-sm);border-radius:var(--r-full);background:var(--bg-surface);border:1px solid var(--border-subtle);box-shadow:var(--shadow-edge);color:var(--text-primary);margin-top:3px;transition:background .2s,border-color .2s,box-shadow .2s}
.cite:hover{border-color:var(--border-default)}
.cite.on,.cite:active{background:var(--bg-pressed);border-color:var(--bg-pressed);box-shadow:none}
@container sum (min-width:980px){
  .secs{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--sp-4xl)}
}
@container sum (max-width:470px){
  .doc{padding-top:var(--sp-2xl)}
  .pt{grid-template-columns:1fr;font-size:15px}
  .pt .cite{justify-self:start;margin:0 0 var(--sp-xs)}
  .d-sum{margin-top:var(--sp-2xl)}
  .avs{display:none}
}
@container sum (max-width:360px){
  .d-head h1{font-size:22px}
  .doc{padding-left:var(--sp-xl);padding-right:var(--sp-lg)}
  .lede{font-size:16px}
}
.empty{padding:120px 40px;text-align:center;color:var(--text-tertiary);font-size:16px;line-height:22px}

/* ---------- transcript ---------- */
.tr-panel{position:absolute;top:var(--sp-lg);bottom:var(--sp-lg);right:var(--sp-sm);width:calc(var(--tw,440px) - 16px);background:var(--bg-subtle);border-radius:var(--r-2xl);display:flex;flex-direction:column;overflow:hidden;container:tr/inline-size;opacity:0;transform:translateX(18px);transition:opacity .28s ease,transform .5s var(--ease)}
.pane.tr-open .tr-panel{opacity:1;transform:none;transition:opacity .35s ease .06s,transform .5s var(--ease)}
.tr-head{height:64px;flex:none;display:flex;align-items:center;justify-content:center;padding:0 60px;font-size:18px;line-height:22px;letter-spacing:-.02em;position:relative}
.tr-head span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container tr (max-width:320px){.tr-head{justify-content:flex-start;padding:0 60px 0 var(--sp-xl)}}
.tr-head .ib{position:absolute;right:var(--sp-md);top:var(--sp-md);background:var(--bg-surface);box-shadow:var(--shadow-xs)}
.tr-head .ib:hover{background:var(--bg-pressed)}
.tr-scroll{flex:1;overflow:auto;position:relative;padding:0 var(--sp-lg) 50vh;scrollbar-width:thin}
.para{position:relative;padding:var(--sp-lg);margin-bottom:var(--sp-xs);border-radius:var(--r-xl);transition:background .4s ease,box-shadow .4s ease}
.para.hit{background:var(--bg-surface);box-shadow:var(--shadow-s)}
.para-top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-md);margin-bottom:var(--sp-md)}
.spk{display:inline-flex;align-items:center;gap:var(--sp-sm);height:32px;padding:0 var(--sp-md) 0 var(--sp-xs);border-radius:var(--r-full);background:var(--bg-surface);box-shadow:var(--shadow-edge);font-size:12px;line-height:14px;white-space:nowrap}
.para.hit .spk{background:var(--bg-subtle);box-shadow:none}
.spk .av{width:24px;height:24px;font-size:11px;box-shadow:none}
.ts{font-size:12px;line-height:14px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.para p{margin:0;font-family:var(--serif);font-weight:300;font-size:16px;line-height:30px;letter-spacing:.01em}
@container tr (min-width:580px){
  .para{display:grid;grid-template-columns:140px 1fr;gap:var(--sp-lg)}
  .para-top{flex-direction:column;align-items:flex-start;gap:var(--sp-sm);margin:0}
  .tr-scroll{padding-left:var(--sp-xl);padding-right:var(--sp-xl)}
}
@container tr (max-width:320px){
  .tr-scroll{padding-left:var(--sp-sm);padding-right:var(--sp-sm)}
  .para p{font-size:15px;line-height:26px}
}

/* ---------- actions ---------- */
.act-panel{position:absolute;top:var(--sp-lg);bottom:var(--sp-lg);right:var(--sp-lg);width:calc(var(--aw,80px) - 24px);background:var(--bg-subtle);border-radius:var(--r-2xl);overflow:hidden;transition:width var(--dur) var(--ease),box-shadow .35s ease}
.a-ov .act-panel{width:calc(var(--aw-open,380px) - 24px);box-shadow:var(--shadow-xl);z-index:8}
.act-full{position:absolute;top:0;right:0;bottom:0;width:calc(var(--aw-open,380px) - 24px);display:flex;flex-direction:column;container:act/inline-size;opacity:0;visibility:hidden;transition:opacity .12s ease,visibility 0s .12s}
.a-docked .act-full,.a-ov .act-full{opacity:1;visibility:visible;transition:opacity .3s ease .17s,visibility 0s}
.act-head{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-md) 0 var(--sp-xl)}
.ah-t{display:flex;align-items:center;gap:var(--sp-sm);font-size:18px;line-height:22px;letter-spacing:-.02em}
.ah-t svg{width:20px;height:20px}
.ah-t em{font-style:normal;font-size:12px;line-height:14px;letter-spacing:0;color:var(--text-tertiary)}
.cards{flex:1;overflow:auto;padding:0 var(--sp-sm) var(--sp-sm);display:flex;flex-direction:column;gap:var(--sp-sm);scrollbar-width:thin}
@container act (min-width:640px){.cards:not(.grouped),.agrp-cards{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;align-content:start}}
.card{display:flex;flex-direction:column;align-items:stretch;background:var(--bg-surface);border-radius:var(--r-xl);padding:var(--sp-lg);position:relative;box-shadow:var(--shadow-s);transition:box-shadow .3s}
.card.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 transparent}20%{box-shadow:0 0 0 2px var(--accent-blue)}100%{box-shadow:0 0 0 2px transparent}}
.cd-top{display:flex;justify-content:space-between;align-items:center}
.app-ic{width:48px;height:48px;border-radius:50%;background:var(--bg-subtle);display:grid;place-items:center;flex:none}
.app-ic img{width:24px;height:24px;object-fit:contain;display:block}
.card h3{font-size:20px;line-height:25px;font-weight:400;letter-spacing:-.02em;margin:var(--sp-md) 0 var(--sp-sm)}
.cd-src{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-md);font-size:12px;line-height:14px;color:var(--text-tertiary)}
.cd-src .src{display:flex;align-items:center;gap:var(--sp-xs);min-width:0}
.cd-src .src span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-src svg{width:14px;height:14px}
.cd-src .when{flex:none}
.tag{display:inline-flex;align-items:center;gap:var(--sp-xs);margin-top:var(--sp-sm);font-size:10px;line-height:12px;font-weight:500;color:var(--text-secondary);background:var(--bg-subtle);border-radius:var(--r-xs);padding:var(--sp-xs) 6px}
.tag svg{width:12px;height:12px}
.card .tag{align-self:flex-start}
.cd-body{margin:var(--sp-lg) 0;padding-top:var(--sp-lg);border-top:1px solid var(--border-subtle);font-size:14px;line-height:20px}
.kv{margin:0;display:flex;flex-direction:column;gap:var(--sp-sm)}
.kv>div{display:flex;align-items:center;gap:var(--sp-xs);min-height:20px}
.kv dt{color:var(--text-tertiary)}
.kv dd{margin:0;display:flex;align-items:center}
.cd-desc{margin:var(--sp-md) 0 0;color:var(--text-secondary)}
.mail-body{margin:var(--sp-md) 0 0;color:var(--text-secondary);white-space:pre-line;max-height:7.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.chk{display:flex;flex-direction:column;gap:var(--sp-sm)}
.chk button{display:flex;align-items:center;gap:var(--sp-md);width:100%;text-align:left;min-height:48px;padding:var(--sp-md) var(--sp-lg) var(--sp-md) var(--sp-md);border-radius:var(--r-xl);background:var(--bg-subtle);font-size:14px;line-height:17px;transition:background .2s,color .2s}
.chk button:hover{background:var(--bg-pressed)}
.chk i{width:20px;height:20px;border-radius:50%;background:var(--bg-inverse);color:var(--icon-inverse);display:grid;place-items:center;flex:none;transition:background .2s,transform .25s var(--ease)}
.chk i svg{width:12px;height:12px;stroke-width:2.4}
.chk button.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--border-strong)}
.chk button.off i svg{opacity:0}
.chk button.off span{color:var(--text-tertiary)}
.cta{margin-top:auto;flex:none;width:100%;height:48px;border-radius:var(--r-full);background:var(--bg-surface);border:1px solid var(--border-default);box-shadow:var(--shadow-edge);font-size:14px;line-height:17px;display:flex;align-items:center;justify-content:center;gap:var(--sp-sm);transition:background .2s,color .2s,box-shadow .2s}
.cta:hover{background:var(--bg-subtle)}
.cta:active{background:var(--bg-pressed);box-shadow:none}
.cta.done{background:var(--bg-inverse);color:var(--text-inverse);border-color:var(--bg-inverse);box-shadow:none}
.cta svg{width:16px;height:16px;stroke-width:2.2}
.act-empty{padding:var(--sp-sm) var(--sp-xl);color:var(--text-tertiary);font-size:14px;line-height:20px}
@container act (max-width:300px){
  .card .tag{margin-bottom:var(--sp-lg)}
  .cd-body{display:none}
  .card h3{font-size:18px;line-height:22px}
  .app-ic{width:40px;height:40px}
  .app-ic img{width:20px;height:20px}
}

.act-rail{position:absolute;top:0;left:0;width:56px;display:flex;flex-direction:column;align-items:center;padding-top:var(--sp-lg);gap:var(--sp-md);transition:opacity .22s ease .2s}
.act-rail>.ib{width:32px;height:32px}
.a-docked .act-rail,.a-ov .act-rail{opacity:0;pointer-events:none;transition:opacity .08s ease}
.rail-div{width:24px;height:1px;background:var(--border-default);display:block}
.rail-apps{display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm)}
.rail-app{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg-surface);box-shadow:var(--shadow-xs);transition:background .15s,opacity .3s ease,transform .45s var(--ease);transition-delay:0s,calc(.22s + var(--i)*45ms),calc(.22s + var(--i)*45ms)}
.rail-app:hover{transform:scale(1.06)}
.rail-app .app-ic{width:auto;height:auto;background:none}
.rail-app .app-ic img{width:20px;height:20px}
.a-docked .rail-app,.a-ov .rail-app{opacity:0;transform:translateX(10px);transition-delay:0s}

/* ---------- merged actions (multi-window) ---------- */
.g-act{flex:none;width:0;height:100%;position:relative;overflow:hidden;transition:width var(--dur) var(--ease)}
.g-act .act-panel{top:56px;bottom:var(--sp-sm);left:5px;right:var(--sp-sm);width:auto;border:1px solid var(--border-subtle);border-radius:var(--r-xl)}
.g-act .act-full{width:calc(var(--aw-open,380px) - 13px)}
.g-act .act-rail{width:100%}
.g-act .rz-g{position:absolute;left:5px;top:0;bottom:0;width:0}
.g-act .rz-g::before{left:-5px;width:10px}
.g-act .rz-g::after{top:72px;bottom:var(--sp-xl);left:-4px}
.pane.a-none .c-act{overflow:hidden}
.pane.a-none .act-panel{opacity:0;transition:opacity .15s,width var(--dur) var(--ease)}
.pane.a-none .rz-a{display:none}
.cards.grouped{gap:var(--sp-md)}
.agrp{display:flex;flex-direction:column;gap:var(--sp-sm);border-radius:var(--r-xl);transition:background .25s}
.agrp+.agrp{padding-top:var(--sp-md);border-top:1px solid var(--border-default)}
.agrp-h{display:flex;align-items:center;gap:var(--sp-sm);height:32px;padding:0 var(--sp-md);border-radius:var(--r-md);font-size:12px;line-height:14px;color:var(--text-tertiary);text-align:left;transition:background .15s,color .2s}
.agrp-h:hover{background:var(--hover)}
.agrp-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary)}
.agrp-h em{font-style:normal}
.agrp.focus .agrp-h,.agrp.focus .agrp-t{color:var(--text-primary)}
.agrp-cards{display:flex;flex-direction:column;gap:var(--sp-sm)}
.agrp .cd-src{justify-content:flex-start}
.agrp .cd-src .src{display:none}
.agrp-h{position:sticky;top:0;z-index:2;background:var(--bg-subtle)}
.agrp-h:hover{background:var(--bg-pressed)}
svg.win{width:18px;height:14px;stroke-width:1.4}
.rail-grp{display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm)}
.rail-grp+.rail-grp{margin-top:var(--sp-xs);padding-top:var(--sp-md);border-top:1px solid var(--border-default)}
.rail-win{height:20px;display:grid;place-items:center;color:var(--text-tertiary);transition:color .2s}
.rail-grp.focus .rail-win{color:var(--text-primary)}
.win-badge{display:none;align-self:flex-end;width:32px;height:32px;margin:0 var(--sp-xs) var(--sp-sm) 0;place-items:center;color:var(--text-tertiary);flex:none;transition:color .2s}
.workspace.multi .win-badge{display:none}
.workspace.multi .pane.focus .win-badge{color:var(--text-primary)}
.workspace.multi .pane:not(.first) .tb-back{display:none}
.workspace.multi .pane:not(.first) .win-badge{margin-left:var(--sp-md)}
.workspace.multi .pane.peek .pbody{box-shadow:0 0 0 1.5px var(--border-strong)}

/* ---------- menu (DS Menu) ---------- */
.ctx{position:fixed;z-index:50;min-width:248px;background:var(--bg-surface);border-radius:var(--r-menu);box-shadow:var(--shadow-xl);overflow:hidden;opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top left;pointer-events:none;transition:opacity .14s ease,transform .22s var(--ease)}
.ctx.show{opacity:1;transform:none;pointer-events:auto}
.ctx button{display:flex;align-items:center;gap:var(--sp-md);width:100%;height:64px;padding:0 var(--sp-xl) 0 var(--sp-md);font-size:14px;line-height:17px;text-align:left;transition:background .15s}
.ctx button:hover,.ctx button:focus-visible{background:var(--bg-subtle);outline:none}
.ctx .ci{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg-subtle);flex:none}
.ctx button:hover .ci{background:var(--bg-surface)}
.ctx .ci svg{width:20px;height:20px}
.ctx hr{border:0;border-top:1px solid var(--border-subtle);margin:0}

.toast{position:fixed;left:50%;bottom:var(--sp-2xl);z-index:60;transform:translate(-50%,16px);opacity:0;background:var(--bg-inverse);color:var(--text-inverse);border-radius:var(--r-full);height:48px;padding:0 var(--sp-sm) 0 var(--sp-xl);font-size:14px;line-height:17px;display:flex;align-items:center;gap:var(--sp-md);box-shadow:var(--shadow-xs);transition:opacity .2s,transform .35s var(--ease);pointer-events:none}
.toast:has(button:empty){padding-right:var(--sp-xl)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:32px;padding:0 var(--sp-md);border-radius:var(--r-full);background:rgba(127,127,127,.28);font-size:14px}
.toast button:empty{display:none}

.hint{position:fixed;right:var(--sp-xl);bottom:var(--sp-xl);z-index:40;font-size:12px;line-height:18px;color:var(--text-secondary);background:var(--bg-surface);border-radius:var(--r-lg);padding:var(--sp-md) var(--sp-lg);box-shadow:var(--shadow-xl);max-width:260px;transition:opacity .3s}
.hint b{font-weight:500;color:var(--text-primary)}
.hint.hide{opacity:0;pointer-events:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>

summary:'The team compared competitor approaches (Pocket, Notion, Claude) to AI chat and debated bringing similar in-recording search to Nexo without making the AI feel like a person. The current search button was described as nearly useless, while competitor UIs feel overly complex.',
sections:[
 {label:'Key points',items:[['All three competitors offer chat inside a recording; none separate search from Q&A.','00:14'],['Search should find moments, not answer questions. Keep the AI out of first person.','01:26'],['Desktop users want several recordings open at once to cross-reference.','02:09']]},
 {label:'Decisions',items:[['Prototype in-recording search with highlighted matches in the transcript.','03:02'],['Park the chat concept until after the search test round.','03:02']]},
 {label:'Open questions',items:[['Should search results open as their own tab or filter the transcript in place?','03:40']]},
 {label:'Next steps',items:[['Erik sends a catch-up email and books a follow-up for tomorrow.','04:05'],['Ana keeps the competitor notes in the Logi Nexo folder.','03:24']]}],
transcript:[
 ['00:00','Erik','Alright, I think we’re all here now — let’s go ahead and get started. I’m really glad we finally got everyone together for this. We’ve been circling around this project for a while, and it feels good to put it on the calendar and treat it like the real thing it is.'],
 ['00:14','Ana','So I went through Pocket, Notion and Claude. All three put a chat box inside the recording. None of them separates search from Q&A — it’s one input that tries to do both, and you can feel it.'],
 ['00:41','Lisa','That’s what makes them feel heavy. You open a meeting to check one thing and suddenly you’re in a conversation with it.'],
 ['01:02','Jonas','Our current search button doesn’t help either. Honestly, it’s nearly useless. It matches exact words and that’s it — no context, no jump to the moment.'],
 ['01:26','Erik','I’d frame it like this: search should find moments, not answer questions. And keep the AI out of first person. No “I found three things for you.”'],
 ['01:51','Ana','Agreed. If it talks like a person, people expect it to reason like one, and the local model can’t carry that.'],
 ['02:09','Lisa','One more thing from the interviews. Desktop users want several recordings open at once. They cross-reference last week’s review with this week’s, side by side.'],
 ['02:35','Jonas','That changes the layout question. Tabs alone won’t do it — they want to see two things at the same time and resize them.'],
 ['03:02','Erik','Then let’s prototype in-recording search with highlighted matches in the transcript, and park the chat concept until after the search test round.'],
 ['03:24','Ana','Fine by me. I’ll keep the competitor notes in the Logi Nexo folder so we can come back to them.'],
 ['03:40','Lisa','Open question though: should search results open as their own tab, or filter the transcript in place?'],
 ['04:05','Erik','Let’s test both. I’ll send a catch-up email tonight and book a follow-up for tomorrow afternoon.']],

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE='cubic-bezier(.22,.8,.18,1)';
const av=(n,cls='')=>{const c=PEOPLE[n]||['#777','#fff'];return `<span class="av ${cls}" style="--c:${c[0]};--f:${c[1]}" title="${n}">${n[0]}</span>`;};
const avGroup=(ps,max=2)=>`<span class="avs">${ps.slice(0,max).map(n=>av(n)).join('')}${ps.length>max?`<span class="av more">+${ps.length-max}</span>`:''}</span>`;

/* ================= layout constants & state ================= */
const PANE_DRAG_MIN=340, PANE_CLOSE=300;
const RAILW=86, RAILCOL=80, MIN_S=400, MIN_A=280, MIN_T=280, MIN_PANE=420, SB_DEF=218, T_DEF=440, A_DEF=380, MAX_PANES=3;
let uid=0; const GRAIL=72;
const winIc=(i,n)=>{const cw=12/n;return `<svg class="win" viewBox="0 0 18 14"><rect x="1" y="1" width="16" height="12" rx="2.5"/><rect x="${(3+i*cw+(i?0.5:0)).toFixed(2)}" y="3" width="${(cw-(n>1?0.5:0)).toFixed(2)}" height="8" rx="1" fill="currentColor" stroke="none"/></svg>`;};
const S={gOpen:false,gW:A_DEF,_total:0,sidebarOpen:true,sidebarW:SB_DEF,panes:[],ratios:[1],focus:null,deleted:new Set()};
function mkPane(rec){return {id:'p'+(++uid),tabs:[rec],active:rec,hist:[],tOpen:false,tW:T_DEF,aW:A_DEF,aOpen:true,aTuck:false,aOv:false,w:0,lay:null,el:null};}
const pane=id=>S.panes.find(p=>p.id===id);
const focusPane=()=>pane(S.focus)||S.panes[0];

/* ================= fit: decide column widths for one pane ================= */
function fit(p,w){
  if(S.panes.length>1){ // actions live in the merged side bar
    let t=p.tOpen?p.tW:0; const over=MIN_S+t-w; if(over>0&&p.tOpen) t=Math.max(240,t-over);
    return {t:Math.round(t),a:0,docked:false,ov:false,none:true,aOpenW:0};
  }
  const want=p.aOpen&&!p.aTuck;
  let t=p.tOpen?p.tW:0, a=want?p.aW:RAILCOL, docked=want;
  let over=MIN_S+t+a-w;
  if(over>0&&docked){const d=Math.min(over,a-MIN_A);a-=d;over-=d;}
  if(over>0&&p.tOpen){const d=Math.min(over,t-MIN_T);t-=d;over-=d;}
  if(over>0&&docked){over-=(a-RAILCOL);a=RAILCOL;docked=false;}
  if(over>0&&p.tOpen){const d=Math.min(over,t-240);t-=Math.max(0,d);}
  const ov=!docked&&want&&p.aOv;
  if(docked) p.aOv=false;
  return {t:Math.round(t),a:Math.round(a),docked,ov,aOpenW:docked?Math.round(a):Math.round(Math.min(p.aW,w-56))};
}

/* ================= DOM: panes ================= */
const ws=$('#ws'), appEl=$('#app'), sidebar=$('#sidebar');
function mountPane(p,afterEl){
  const el=document.createElement('section');
  el.className='pane'; el.dataset.id=p.id;
  el.innerHTML=`
  <div class="rz rz-p" data-rz="p" title="Drag to resize · double-click to split evenly"></div>
  <div class="tabbar">
    <button class="ib tb-back" data-act="back" aria-label="Back">${I.chevL}</button><span class="win-badge" aria-hidden="true"></span>
    <div class="tabs" role="tablist"></div><div class="tb-sp"></div>
    <button class="ib tb-more" data-act="more" aria-label="More">${I.more}</button>
  </div>
  <i class="focus-bar"></i>
  <div class="pbody">
    <div class="col c-sum"><div class="doc"></div></div>
    <div class="rz rz-t" data-rz="t" title="Drag to resize · double-click to reset"></div>
    <div class="col c-tr"><div class="tr-panel" aria-label="Transcription">
      <div class="tr-head"><span>Transcription</span><button class="ib contained" data-act="tclose" aria-label="Close transcription">${I.x}</button></div>
      <div class="tr-scroll"></div></div></div>
    <div class="rz rz-a" data-rz="a" title="Drag to resize · double-click to reset"></div>
    <div class="col c-act"><div class="act-panel" aria-label="Actions">
      <div class="act-full"><div class="act-head"><span class="ah-t">${I.actions}Actions<em class="act-n"></em></span><button class="ib" data-act="acollapse" aria-label="Collapse actions" title="Collapse actions">${I.collapse}</button></div><div class="cards"></div></div>
      <div class="act-rail"><button class="ib" data-act="aexpand" aria-label="Expand actions" title="Expand actions">${I.actions}</button><i class="rail-div"></i><div class="rail-apps"></div></div>
    </div></div>
  </div>`;
  if(afterEl) afterEl.after(el); else ws.appendChild(el);
  p.el=el;
  el.querySelector('.tr-scroll').addEventListener('scroll',()=>{},{passive:true});
  return el;
}

const openCount=()=>S.panes.reduce((n,q)=>n+q.tabs.length,0);
function syncClosable(){ws.classList.toggle('solo',openCount()<=1);}
function renderTabs(p,enterId){
  const box=p.el.querySelector('.tabs');
  box.innerHTML=p.tabs.map(id=>`<div class="tab${id===p.active?' on':''}" data-tab="${id}" role="tab" aria-selected="${id===p.active}" title="${esc(REC[id].title)}">${I.doc}<span class="t-l">${esc(REC[id].title)}</span><button class="t-x" data-act="tabclose" data-id="${id}" aria-label="Close tab">${I.x}</button></div>`).join('');
  p.el.querySelector('.tb-back').disabled=!p.hist.length;
  syncClosable();
  if(enterId&&!RM){
    const t=box.querySelector(`[data-tab="${enterId}"]`);
    t&&t.animate([{maxWidth:'0px',opacity:0,paddingLeft:'0px'},{maxWidth:'240px',opacity:1,paddingLeft:'16px'}],{duration:380,easing:EASE});
  }
}

function docHTML(r){
  return `<header class="d-head" data-stg><h1>${esc(r.title)}</h1>
    <div class="meta"><span>${I.mic}${DAY[r.d].date} · ${r.time}</span><span>${I.folder}${esc(r.folder)}</span>${avGroup(r.people)}</div></header>
  <section class="d-sum" data-stg><div class="lbl">Summary</div><p class="lede">${esc(r.summary)}</p></section>
  <div class="secs">${r.sections.map(s=>`<section class="d-sec" data-stg><div class="lbl">${s.label}</div><ul class="pts">${s.items.map(([t,c])=>`<li class="pt"><span>${esc(t)}</span>${c?`<button class="cite" data-cite="${c}" title="Show in transcription">${c}</button>`:''}</li>`).join('')}</ul></section>`).join('')}</div>`;
}
function trHTML(r){
  return r.transcript.map(([t,s,x])=>`<div class="para" data-t="${t}"><div class="para-top"><span class="spk">${av(s)}${s}</span><span class="ts">${t}</span></div><p>${esc(x)}</p></div>`).join('');
}
function cardHTML(a,r,i){
  let body='';
  if(a.type==='cal') body=`<dl class="kv"><div><dt>Title:</dt><dd>${esc(a.mtitle)}</dd></div><div><dt>Time:</dt><dd>${esc(a.when)}</dd></div><div><dt>Attendees:</dt><dd>${avGroup(a.people,3)}</dd></div></dl><p class="cd-desc">${esc(a.desc)}</p>`;
  if(a.type==='mail') body=`<dl class="kv"><div><dt>Subject:</dt><dd>${esc(a.subject)}</dd></div><div><dt>To:</dt><dd>${avGroup(a.people,3)}</dd></div></dl><p class="mail-body">${esc(a.body)}</p>`;
  if(a.type==='task') body=`<div class="chk">${a.items.map(([t,on],j)=>`<button class="${on?'':'off'}" data-act="chk" data-i="${i}" data-j="${j}" aria-pressed="${!!on}"><i>${I.check}</i><span>${esc(t)}</span></button>`).join('')}</div>`;
  return `<article class="card" data-card="${i}" data-stg>
    <div class="cd-top"><span class="app-ic ${a.type}">${APPI[a.type]}</span><button class="ib" data-act="cdel" data-i="${i}" aria-label="Remove action" title="Remove action">${I.trash}</button></div>
    <h3>${esc(a.title)}</h3>
    <div class="cd-src"><span class="src">${I.wave}<span>${esc(r.title)}</span></span><span class="when">${DAY[r.d].label} ${r.time}</span></div>
    <span class="tag">${I.folder}${esc(r.folder)}</span>
    <div class="cd-body">${body}</div>
    <button class="cta${a.isDone?' done':''}" data-act="cta" data-i="${i}">${a.isDone?I.check+a.done:a.cta}</button>
  </article>`;
}
function renderActions(p){
  const r=REC[p.active];
  const cards=p.el.querySelector('.cards'), rail=p.el.querySelector('.rail-apps');
  p.el.querySelector('.act-n').textContent=r&&r.actions.length?r.actions.length:'';
  if(!r){cards.innerHTML='';rail.innerHTML='';return;}
  cards.innerHTML=r.actions.length?r.actions.map((a,i)=>cardHTML(a,r,i)).join(''):`<div class="act-empty">No actions in this recording yet.</div>`;
  rail.innerHTML=r.actions.map((a,i)=>`<button class="rail-app" style="--i:${i}" data-act="ajump" data-i="${i}" title="${esc(a.title)}" aria-label="${esc(a.title)}"><span class="app-ic ${a.type}">${APPI[a.type]}</span></button>`).join('');
}
function stagger(nodes){
  if(RM) return;
  nodes.slice(0,10).forEach((n,i)=>n.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:460,delay:i*38,easing:EASE,fill:'backwards'}));
}
function renderContent(p,anim){
  const r=REC[p.active];
  const doc=p.el.querySelector('.doc'), sum=p.el.querySelector('.c-sum'), trs=p.el.querySelector('.tr-scroll'), cards=p.el.querySelector('.cards');
  const go=()=>{
    if(!r){doc.innerHTML=`<div class="empty">No recording open. Pick one from the list.</div>`;trs.innerHTML='';renderActions(p);p.el.classList.add('is-empty');return;}
    p.el.classList.remove('is-empty');
    doc.innerHTML=docHTML(r); sum.scrollTop=0;
    trs.innerHTML=trHTML(r); trs.scrollTop=0;
    renderActions(p); renderGlobal(anim);
    if(anim){stagger($$('[data-stg]',doc));stagger($$('.card',cards));stagger($$('.para',trs).slice(0,4));}
  };
  if(anim&&!RM&&doc.childElementCount){
    const outs=[doc,cards,trs].map(n=>n.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-4px)'}],{duration:130,easing:'ease-in',fill:'forwards'}));
    outs[0].onfinish=()=>{go();outs.forEach(a=>a.cancel());};
  } else go();
  syncSidebar();
}

/* ================= layout ================= */
function layoutAll(){
  const W=appEl.clientWidth;
  const sb=S.sidebarOpen?S.sidebarW:0;
  sidebar.style.width=sb+'px';
  appEl.classList.toggle('sb-closed',!S.sidebarOpen);
  $('#sbToggle').setAttribute('aria-label',S.sidebarOpen?'Hide recording list':'Show recording list');
  let total=W-RAILW-sb;
  const multi=S.panes.length>1;
  let gw=0;
  if(multi){ gw=S.gOpen?Math.min(S.gW,560):GRAIL; if(S.gOpen&&total-gw<S.panes.length*340) gw=GRAIL; }
  gAct.style.width=gw+'px';
  gAct.classList.toggle('a-docked',multi&&gw>GRAIL);
  gAct.style.setProperty('--aw-open',(gw>GRAIL?gw:S.gW)+'px');
  total-=gw; S._total=total;
  ws.classList.toggle('multi',multi);
  let x=0;
  S.panes.forEach((p,i)=>{
    const w=i===S.panes.length-1?total-x:Math.round(total*S.ratios[i]);
    x+=w; applyPane(p,w,i);
  });
  ws.classList.toggle('multi',S.panes.length>1);
  syncClosable();
}
function applyPane(p,w,i){
  const multi=S.panes.length>1;
  const inset=multi?((i===0?8:5)+5+2):8;
  p.w=w-inset;
  const L=fit(p,p.w); p.lay=L;
  const el=p.el;
  el.classList.toggle('first',i===0);
  el.style.width=w+'px';
  el.querySelector('.c-tr').style.width=L.t+'px';
  el.querySelector('.c-act').style.width=(L.none?0:(L.docked?L.a:RAILCOL))+'px';
  el.classList.toggle('a-none',!!L.none);
  el.classList.toggle('last',i===S.panes.length-1);

  el.style.setProperty('--tw',(p.tOpen?L.t:p.tW)+'px');
  el.style.setProperty('--aw',(L.docked?L.a:RAILCOL)+'px');
  el.style.setProperty('--aw-open',L.aOpenW+'px');
  el.classList.toggle('tr-open',p.tOpen);
  el.classList.toggle('a-docked',L.docked);
  el.classList.toggle('a-ov',L.ov);
  el.querySelector('.rz-p').style.display=i===0?'none':'';
}
function snapPane(p){p.el.classList.add('snap');clearTimeout(p._snap);p._snap=setTimeout(()=>p.el.classList.remove('snap'),420);}
function snapBody(){document.body.classList.add('snapping');clearTimeout(snapBody.t);snapBody.t=setTimeout(()=>document.body.classList.remove('snapping'),420);}

/* ================= sidebar ================= */
const list=$('#sideList');
function renderSidebar(){
  list.innerHTML='<i class="sel" id="sel"></i>'+GROUPS.map(g=>{
    const ids=g.ids.filter(id=>!S.deleted.has(id)); if(!ids.length) return '';
    return `<div class="grp"><div class="grp-l">${DAY[g.d].label}</div>${ids.map(id=>{const r=REC[id];return `<button class="row" data-rec="${id}">${r.kind==='chat'?I.chat:I.mic}<span class="r-t">${esc(r.title)}</span>${r.isNew?'<span class="new">New</span>':''}<span class="r-time">${r.time}</span><i class="r-dot" title="Open in another tab"></i></button>`}).join('')}</div>`;
  }).join('');
  syncSidebar(true);
}
function syncSidebar(instant){
  const fp=focusPane(); const act=fp&&fp.active;
  const open=new Set(); S.panes.forEach(p=>p.tabs.forEach(t=>open.add(t)));
  let on=null;
  $$('.row',list).forEach(r=>{const id=r.dataset.rec;r.classList.toggle('on',id===act);r.classList.toggle('open',open.has(id)&&id!==act);if(id===act) on=r;});
  const sel=$('#sel');
  if(!sel) return;
  if(on){
    if(instant) sel.style.transition='none';
    const top=on.getBoundingClientRect().top-list.getBoundingClientRect().top+list.scrollTop-parseFloat(getComputedStyle(list).borderTopWidth||0);
    sel.style.opacity=1; sel.style.transform=`translateY(${Math.round(top)}px)`;
    if(instant){sel.offsetWidth;sel.style.transition='';}
  } else sel.style.opacity=0;
}

/* ================= actions on panes ================= */
function setFocus(p){
  if(!p||S.focus===p.id) return;
  S.focus=p.id;
  S.panes.forEach(q=>q.el.classList.toggle('focus',q===p));
  $$('.agrp,.rail-grp',gAct).forEach(g=>g.classList.toggle('focus',g.dataset.pane===p.id));
  syncSidebar();
}
function openInPane(p,id,{pushHist=true}={}){
  if(!p||p.active===id){setFocus(p);return;}
  if(p.tabs.includes(id)){ if(pushHist&&p.active) p.hist.push(p.active); p.active=id; }
  else if(p.active){ const i=p.tabs.indexOf(p.active); if(pushHist) p.hist.push(p.active); p.tabs[i]=id; p.active=id; }
  else { p.tabs=[id]; p.active=id; }
  renderTabs(p); renderContent(p,true); setFocus(p);
}
function openNewTab(p,id){
  if(p.tabs.includes(id)){openInPane(p,id);return;}
  const i=p.active?p.tabs.indexOf(p.active):-1;
  p.tabs.splice(i+1,0,id); if(p.active) p.hist.push(p.active); p.active=id;
  renderTabs(p,id); renderContent(p,true); setFocus(p);
  toast('Opened in a new tab');
}
function openSide(id){
  const fp=focusPane();
  if(S.panes.length>=MAX_PANES){ const last=S.panes[S.panes.length-1]; openNewTab(last,id); return; }
  const idx=S.panes.indexOf(fp);
  const p=mkPane(id); p.aOpen=false; S.gOpen=false;
  S.panes.forEach(q=>{if(q.aOpen||q.aOv){q.aOpen=false;q.aOv=false;q.aTuck=false;snapPane(q);}});
  S.panes.splice(idx+1,0,p);
  const half=S.ratios[idx]/2; S.ratios.splice(idx,1,half,half);
  const el=mountPane(p,fp.el);
  el.style.width='0px';
  renderTabs(p); renderContent(p,false);
  // start inner columns from rest state for a clean entrance
  layoutPreview(p);
  el.offsetWidth;
  if(S.panes.length>1&&S.sidebarOpen){ S.sidebarOpen=false; }
  layoutAll();
  stagger([...$$('[data-stg]',el)]);
  setFocus(p); renderGlobal(true);
}
function layoutPreview(p){ // set inner widths for target width so the new pane doesn't reflow while growing
  const total=appEl.clientWidth-RAILW-(S.panes.length>1?GRAIL:(S.sidebarOpen?S.sidebarW:0));
  const w=Math.round(total/S.panes.length);
  const L=fit(p,w);
  p.el.querySelector('.c-act').style.transition='none';
  p.el.querySelector('.c-act').style.width=(L.docked?L.a:RAILCOL)+'px';
  p.el.style.setProperty('--aw',(L.docked?L.a:RAILCOL)+'px');
  p.el.classList.toggle('a-docked',L.docked);
  p.el.offsetWidth; p.el.querySelector('.c-act').style.transition='';
}
function closePane(p){
  if(S.panes.length<2) return;
  const i=S.panes.indexOf(p);
  const r=S.ratios[i]; S.panes.splice(i,1); S.ratios.splice(i,1);
  const ni=Math.max(0,i-1); S.ratios[ni]+=r;
  const el=p.el;
  el.style.minWidth='0';
  if(!RM){el.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'});}
  el.style.width='0px';
  if(S.panes.length===1){const q=S.panes[0];q.aOpen=S.gOpen;q.aTuck=false;q.aOv=false;}
  if(S.focus===p.id) setFocus(S.panes[ni]);
  layoutAll(); renderGlobal();
  setTimeout(()=>el.remove(),RM?0:480);
  syncSidebar();
}
function closeTab(p,id){
  const i=p.tabs.indexOf(id); if(i<0||openCount()<=1) return; // something is always open
  const finish=()=>{
    p.tabs.splice(i,1); p.hist=p.hist.filter(h=>p.tabs.includes(h));
    if(!p.tabs.length){
      if(S.panes.length>1){closePane(p);return;}
      p.active=null; p.tOpen=false; renderTabs(p); renderContent(p,false); layoutAll(); return;
    }
    if(p.active===id){p.active=p.tabs[Math.min(i,p.tabs.length-1)];renderTabs(p);renderContent(p,true);}
    else renderTabs(p);
    syncSidebar();
  };
  const t=p.el.querySelector(`[data-tab="${id}"]`);
  if(t&&!RM&&p.tabs.length>1){t.animate([{maxWidth:t.offsetWidth+'px',opacity:1},{maxWidth:'0px',opacity:0,paddingLeft:'0px',paddingRight:'0px'}],{duration:220,easing:EASE,fill:'forwards'}).onfinish=finish;}
  else finish();
}

/* transcript */
function openTranscript(p,t,btn){
  const was=p.tOpen;
  if(!was){ p.tOpen=true; if(p.aOpen&&!p.aTuck){p.aTuck=true;} snapPane(p); layoutAll(); }
  $$('.cite.on',p.el).forEach(c=>c.classList.remove('on'));
  $$(`.cite[data-cite="${t}"]`,p.el).forEach(c=>c.classList.add('on'));
  setTimeout(()=>scrollToPara(p,t),was?0:300);
}
function scrollToPara(p,t){
  const sc=p.el.querySelector('.tr-scroll'); const para=sc.querySelector(`[data-t="${t}"]`); if(!para) return;
  $$('.para.hit',sc).forEach(x=>{if(x!==para)x.classList.remove('hit');});
  sc.scrollTo({top:Math.max(0,para.offsetTop-20),behavior:RM?'auto':'smooth'});
  para.classList.add('hit');
  if(!RM) para.animate([{background:'var(--hit-strong)'},{background:'var(--hit)'}],{duration:1400,easing:'ease-out',delay:250,fill:'backwards'});
}
function closeTranscript(p){
  p.tOpen=false; if(p.aTuck) p.aTuck=false;
  $$('.cite.on',p.el).forEach(c=>c.classList.remove('on'));
  $$('.para.hit',p.el).forEach(c=>c.classList.remove('hit'));
  snapPane(p); layoutAll();
}
/* actions */
function restoreRatios(q){if(q._prev&&q._prev.length===S.panes.length){S.ratios=q._prev.slice();snapBody();}q._prev=null;}
function collapseOthers(p){S.panes.forEach(q=>{if(q!==p&&(q.aOpen||q.aOv)){q.aOpen=false;q.aOv=false;q.aTuck=false;restoreRatios(q);snapPane(q);}});}
function growForActions(p){ // give the window that opens its actions enough room to dock them, borrowing from a neighbour
  if(S.panes.length<2) return;
  const total=appEl.clientWidth-RAILW-(S.sidebarOpen?S.sidebarW:0);
  const i=S.panes.indexOf(p), need=MIN_S+340+(p.tOpen?MIN_T:0)+16, cur=S.ratios[i]*total;
  if(cur>=need) return;
  const cand=[i-1,i+1].filter(j=>j>=0&&j<S.panes.length).sort((a,b)=>S.ratios[b]-S.ratios[a]);
  const ni=cand[0]; const give=Math.min(need-cur,S.ratios[ni]*total-460); if(give<=0) return;
  p._prev=S.ratios.slice();
  S.ratios[i]+=give/total; S.ratios[ni]-=give/total; snapBody();
}
function expandActions(p,jump){
  collapseOthers(p);
  p.aOpen=true; p.aTuck=false;
  growForActions(p);
  const L=fit(p,p.w);
  if(!L.docked) p.aOv=true;
  snapPane(p); layoutAll();
  if(jump!=null){
    setTimeout(()=>{const c=p.el.querySelector(`[data-card="${jump}"]`); if(!c) return;
      c.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'}); c.classList.remove('flash'); c.offsetWidth; c.classList.add('flash');},420);
  }
}
function collapseActions(p){p.aOpen=false;p.aOv=false;p.aTuck=false;restoreRatios(p);snapPane(p);layoutAll();}

/* ================= resizing ================= */
let drag=null, raf=0, lastE=null;
document.addEventListener('pointerdown',e=>{
  const rz=e.target.closest('.rz'); if(!rz||e.button!==0) return;
  e.preventDefault();
  const kind=rz.dataset.rz, pel=rz.closest('.pane'), p=pel&&pane(pel.dataset.id);
  drag={kind,p,rz,x0:e.clientX,sbW:S.sidebarW,sbOpen:S.sidebarOpen,ratios:[...S.ratios],total:S._total,gW:gAct.offsetWidth,gDocked:gAct.classList.contains('a-docked')};
  if(p){drag.t=p.lay.t;drag.a=p.lay.a;drag.docked=p.lay.docked;drag.aOpen=p.aOpen;drag.aTuck=p.aTuck;drag.idx=S.panes.indexOf(p);}
  rz.setPointerCapture(e.pointerId); rz.classList.add('active');
  document.body.classList.add('dragging');
  if(p) setFocus(p);
  hideHint();
});
document.addEventListener('pointermove',e=>{
  if(!drag) return; lastE=e;
  if(!raf) raf=requestAnimationFrame(()=>{raf=0;onDrag(lastE.clientX-drag.x0);});
});
function endDrag(){
  if(!drag) return;
  const d=drag; drag=null; cancelAnimationFrame(raf); raf=0;
  d.rz.classList.remove('active'); document.body.classList.remove('dragging');
  if(d.kind==='t'&&d.closing){closeTranscript(d.p);}
  if(d.kind==='p'&&d.closeIdx!=null){const q=S.panes[d.closeIdx];S.panes.forEach(x=>x.el.classList.remove('will-close'));S.ratios=d.ratios.slice();layoutAll();closePane(q);return;}
  S.panes.forEach(x=>x.el.classList.remove('will-close'));
  layoutAll();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
function onDrag(dx){
  const d=drag; if(!d) return;
  if(d.kind==='s'){
    const raw=(d.sbOpen?d.sbW:0)+dx;
    if(raw<140){ if(S.sidebarOpen){S.sidebarOpen=false;snapBody();} }
    else { if(!S.sidebarOpen){S.sidebarOpen=true;snapBody();} S.sidebarW=clamp(raw,180,380); }
  }
  else if(d.kind==='p'){
    S.panes.forEach(x=>x._prev=null);
    const i=d.idx-1, T=d.total;
    let wl=d.ratios[i]*T+dx, wr=d.ratios[d.idx]*T-dx; const sum=wl+wr;
    d.closeIdx=null;
    S.panes.forEach(x=>x.el.classList.remove('will-close'));
    if(wr<PANE_CLOSE){d.closeIdx=d.idx;S.panes[d.idx].el.classList.add('will-close');}
    else if(wl<PANE_CLOSE){d.closeIdx=i;S.panes[i].el.classList.add('will-close');}
    wl=clamp(wl,PANE_DRAG_MIN-60,sum-(PANE_DRAG_MIN-60)); wr=sum-wl;
    S.ratios[i]=wl/T; S.ratios[d.idx]=wr/T;
  }
  else if(d.kind==='g'){
    const raw=(d.gDocked?d.gW:GRAIL)-dx;
    if(raw<210){ if(S.gOpen){S.gOpen=false;snapBody();} }
    else { if(!S.gOpen){S.gOpen=true;snapBody();} S.gW=clamp(raw,MIN_A,560); }
  }
  else if(d.kind==='t'){
    const p=d.p, raw=d.t-dx, aCol=p.lay.none?0:(p.lay.docked?p.lay.a:RAILCOL);
    d.closing=raw<200;
    p.el.querySelector('.tr-panel').style.opacity=d.closing?.45:'';
    p.tW=clamp(raw,MIN_T,p.w-MIN_S-aCol);
  }
  else if(d.kind==='a'){
    const p=d.p;
    if(d.docked){
      const raw=d.a-dx;
      if(raw<210){ if(p.aOpen){p.aOpen=false;snapPane(p);} }
      else{
        if(!p.aOpen){collapseOthers(p);p.aOpen=true;p.aTuck=false;snapPane(p);}
        if(p.tOpen){ const a=clamp(raw,MIN_A,d.a+d.t-MIN_T); p.aW=a; p.tW=d.t+d.a-a; }
        else p.aW=clamp(raw,MIN_A,p.w-MIN_S);
      }
    } else {
      const raw=RAILCOL-dx;
      if(raw>230){ if(!p.aOpen||p.aTuck){collapseOthers(p);p.aOpen=true;p.aTuck=false;snapPane(p);} p.aW=clamp(raw,MIN_A,Math.max(MIN_A,p.w-MIN_S-(p.tOpen?MIN_T:0))); }
      else if(p.aOpen!==d.aOpen||p.aTuck!==d.aTuck){p.aOpen=d.aOpen;p.aTuck=d.aTuck;snapPane(p);}
    }
  }
  layoutAll();
}
document.addEventListener('dblclick',e=>{
  const rz=e.target.closest('.rz'); if(!rz) return;
  const pel=rz.closest('.pane'), p=pel&&pane(pel.dataset.id);
  const k=rz.dataset.rz;
  if(k==='s'){S.sidebarW=SB_DEF;S.sidebarOpen=true;}
  if(k==='g'){S.gW=A_DEF;S.gOpen=true;}
  if(k==='p'){S.ratios=S.panes.map(()=>1/S.panes.length);}
  if(k==='t'){p.tW=T_DEF;snapPane(p);}
  if(k==='a'){collapseOthers(p);p.aW=A_DEF;p.aOpen=true;p.aTuck=false;snapPane(p);}
  snapBody(); document.body.classList.remove('dragging'); layoutAll();
});
let rzT;
addEventListener('resize',()=>{document.body.classList.add('resizing');layoutAll();clearTimeout(rzT);rzT=setTimeout(()=>document.body.classList.remove('resizing'),150);});

/* ================= context menu ================= */
const ctx=$('#ctx'); let ctxTarget=null;
function showMenu(x,y,items,target){
  ctx.innerHTML=items.map(it=>it==='-'?'<hr>':`<button role="menuitem" data-cm="${it.id}" class="${it.danger?'danger':''}"><span class="ci">${it.icon}</span><span>${it.label}</span></button>`).join('');
  ctx.classList.remove('show'); ctx.style.left='0px'; ctx.style.top='0px';
  const r=ctx.getBoundingClientRect();
  const left=clamp(x,8,innerWidth-r.width-8), top=clamp(y,8,innerHeight-r.height-8);
  ctx.style.left=left+'px'; ctx.style.top=top+'px';
  ctx.style.transformOrigin=`${x-left}px ${y-top}px`;
  ctxTarget=target; requestAnimationFrame(()=>ctx.classList.add('show'));
  setTimeout(()=>{const b=ctx.querySelector('button');b&&b.focus({preventScroll:true});},30);
}
function hideMenu(){ctx.classList.remove('show');$$('.row.ctx-on').forEach(r=>r.classList.remove('ctx-on'));ctxTarget=null;}
list.addEventListener('contextmenu',e=>{
  const row=e.target.closest('.row'); if(!row) return;
  e.preventDefault(); hideMenu(); row.classList.add('ctx-on'); hideHint();
  showMenu(e.clientX,e.clientY,[
    {id:'tab',label:'Open in a new tab',icon:I.newtab},
    {id:'side',label:'Open in a side window',icon:I.sidewin},'-',
    {id:'del',label:'Delete',icon:I.trash}],{type:'row',id:row.dataset.rec});
});
ctx.addEventListener('click',e=>{
  const b=e.target.closest('[data-cm]'); if(!b||!ctxTarget) return;
  const t=ctxTarget, cm=b.dataset.cm; hideMenu();
  if(t.type==='row'){
    if(cm==='tab') openNewTab(focusPane(),t.id);
    if(cm==='side') openSide(t.id);
    if(cm==='del') deleteRec(t.id);
  }
  if(t.type==='pane'){
    const p=pane(t.id);
    if(cm==='split'&&p.active) {setFocus(p);openSide(p.active);}
    if(cm==='closepane') closePane(p);
    if(cm==='tr') p.tOpen?closeTranscript(p):openTranscript(p,REC[p.active].transcript[0][0]);
  }
});
document.addEventListener('pointerdown',e=>{
  if(ctx.classList.contains('show')&&!ctx.contains(e.target)) hideMenu();
  S.panes.forEach(p=>{ if(p.lay&&p.lay.ov&&!p.el.querySelector('.act-panel').contains(e.target)&&!e.target.closest('.rz')){p.aOv=false;p.aOpen=true;layoutAll();} });
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(ctx.classList.contains('show')) hideMenu(); S.panes.forEach(p=>{if(p.aOv){p.aOv=false;layoutAll();}}); }
  if((e.ctrlKey||e.metaKey)&&e.key==='\\'){e.preventDefault();toggleSidebar();}
  if(ctx.classList.contains('show')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault(); const bs=$$('button',ctx); const i=bs.indexOf(document.activeElement);
    bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus();
  }
});
document.addEventListener('scroll',()=>hideMenu(),true);

function deleteRec(id){
  const row=list.querySelector(`[data-rec="${id}"]`);
  const done=()=>{
    S.deleted.add(id);
    const next=GROUPS.flatMap(g=>g.ids).find(x=>!S.deleted.has(x)&&!S.panes.some(q=>q.tabs.includes(x)));
    S.panes.slice().forEach(p=>{ if(!p.tabs.includes(id)) return; if(openCount()>1) closeTab(p,id); else if(next) openInPane(p,next,{pushHist:false}); });
    S.panes.forEach(p=>{p.hist=p.hist.filter(h=>h!==id);renderTabs(p);});
    renderSidebar();
    const fp=focusPane(); if(fp&&!fp.active){ const first=GROUPS.flatMap(g=>g.ids).find(x=>!S.deleted.has(x)); first&&openInPane(fp,first,{pushHist:false}); }
    toast('Recording deleted','Undo',()=>{S.deleted.delete(id);renderSidebar();});
  };
  if(row&&!RM) row.animate([{height:'36px',opacity:1},{height:'0px',opacity:0}],{duration:240,easing:EASE,fill:'forwards'}).onfinish=done; else done();
}

/* ================= clicks ================= */
document.addEventListener('click',e=>{
  const row=e.target.closest('.row');
  if(row){ openInPane(focusPane(),row.dataset.rec); return; }
  const tab=e.target.closest('.tab');
  const pel=e.target.closest('.pane'); const p=pel&&pane(pel.dataset.id);
  const b=e.target.closest('[data-act]'); const act=b&&b.dataset.act;
  if(act==='tabclose'){e.stopPropagation();closeTab(p,b.dataset.id);return;}
  if(tab&&!act){ if(p.active!==tab.dataset.tab){p.hist.push(p.active);p.active=tab.dataset.tab;renderTabs(p);renderContent(p,true);} setFocus(p); return; }
  const cite=e.target.closest('.cite');
  if(cite&&p){openTranscript(p,cite.dataset.cite,cite);return;}
  if(!act) return;
  if(act==='back'&&p.hist.length){const id=p.hist.pop(); if(!p.tabs.includes(id)){const i=p.tabs.indexOf(p.active);p.tabs[i]=id;} p.active=id; renderTabs(p); renderContent(p,true);}
  if(act==='tclose') closeTranscript(p);
  if(act==='acollapse') collapseActions(p);
  if(act==='aexpand') expandActions(p);
  if(act==='ajump') expandActions(p,+b.dataset.i);
  if(act==='more'){
    const r=b.getBoundingClientRect();
    const items=[{id:'tr',label:p.tOpen?'Hide transcription':'Show transcription',icon:I.doc}];
    if(p.active&&S.panes.length<MAX_PANES) items.push({id:'split',label:'Open in a side window',icon:I.sidewin});
    if(S.panes.length>1) items.push('-',{id:'closepane',label:'Close this window',icon:I.close2});
    showMenu(r.right-250,r.bottom+6,items,{type:'pane',id:p.id});
  }
  if(act==='navactions') toast('Actions view isn’t part of this prototype');
  const grp=b.closest('.agrp'); const recId=grp?grp.dataset.rec:(p&&p.active); const r=recId&&REC[recId];
  if(act==='gexpand'){S.gOpen=true;layoutAll();}
  if(act==='gcollapse'){S.gOpen=false;layoutAll();}
  if(act==='gfocus'&&grp) setFocus(pane(grp.dataset.pane));
  if(act==='gjump'){S.gOpen=true;layoutAll();const q=pane(b.dataset.pane);setFocus(q);
    setTimeout(()=>{const c=gAct.querySelector(`.agrp[data-pane="${b.dataset.pane}"] [data-card="${b.dataset.i}"]`); if(!c) return; c.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'}); c.classList.remove('flash'); c.offsetWidth; c.classList.add('flash');},460);}
  if(act==='cta'&&r){const a=r.actions[+b.dataset.i]; a.isDone=!a.isDone; refreshActions(recId); if(a.isDone) toast(a.done);}
  if(act==='chk'&&r){const it=r.actions[+b.dataset.i].items[+b.dataset.j]; it[1]=it[1]?0:1; b.classList.toggle('off',!it[1]); b.setAttribute('aria-pressed',!!it[1]); if(!RM) b.querySelector('i').animate([{transform:'scale(.7)'},{transform:'scale(1)'}],{duration:300,easing:EASE}); syncChecks(recId,+b.dataset.i,+b.dataset.j,it[1],b);}
  if(act==='cdel'&&r){
    const i=+b.dataset.i, card=b.closest('.card');
    const fin=()=>{r.actions.splice(i,1);refreshActions(recId);toast('Action removed');};
    if(!RM) card.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.96)'}],{duration:200,easing:'ease-in',fill:'forwards'}).onfinish=fin; else fin();
  }
});
document.addEventListener('pointerdown',e=>{const pel=e.target.closest('.pane'); if(pel) setFocus(pane(pel.dataset.id));});
function refreshActions(recId){S.panes.forEach(p=>{if(p.active===recId) renderActions(p);}); renderGlobal();}
const gAct=document.createElement('aside');
gAct.className='g-act'; gAct.setAttribute('aria-label','Actions for open windows');
gAct.innerHTML=`<div class="rz rz-g" data-rz="g" title="Drag to resize · double-click to reset"></div><div class="act-panel">
  <div class="act-full"><div class="act-head"><span class="ah-t">${I.actions}Actions<em class="act-n"></em></span><button class="ib" data-act="gcollapse" aria-label="Collapse actions" title="Collapse actions">${I.collapse}</button></div><div class="cards grouped"></div></div>
  <div class="act-rail"><button class="ib" data-act="gexpand" aria-label="Expand actions" title="Expand actions">${I.actions}</button><i class="rail-div"></i><div class="rail-apps"></div></div></div>`;
function renderGlobal(anim){
  const n=S.panes.length; if(n<2) return;
  const cards=gAct.querySelector('.cards'), rail=gAct.querySelector('.rail-apps'); let total=0;
  cards.innerHTML=S.panes.map((p,i)=>{const r=REC[p.active]; if(!r) return ''; total+=r.actions.length;
    return `<section class="agrp${p.id===S.focus?' focus':''}" data-pane="${p.id}" data-rec="${p.active}"><button class="agrp-h" data-act="gfocus" title="Go to this window"><span class="agrp-t">${esc(r.title)}</span><em>${r.actions.length}</em></button><div class="agrp-cards">${r.actions.length?r.actions.map((a,j)=>cardHTML(a,r,j)).join(''):'<div class="act-empty">No actions in this recording yet.</div>'}</div></section>`;}).join('');
  rail.innerHTML=S.panes.map((p,i)=>{const r=REC[p.active]; if(!r) return '';
    return `<div class="rail-grp${p.id===S.focus?' focus':''}" data-pane="${p.id}">${r.actions.map((a,j)=>`<button class="rail-app" style="--i:${j}" data-act="gjump" data-pane="${p.id}" data-i="${j}" title="${esc(a.title)}" aria-label="${esc(a.title)}"><span class="app-ic ${a.type}">${APPI[a.type]}</span></button>`).join('')}</div>`;}).join('');
  gAct.querySelector('.act-n').textContent=total||'';
  if(anim) stagger($$('.agrp',cards));
}
gAct.addEventListener('pointerover',e=>{const g=e.target.closest('[data-pane]'); S.panes.forEach(p=>p.el.classList.toggle('peek',!!g&&g.dataset.pane===p.id));});
gAct.addEventListener('pointerleave',()=>S.panes.forEach(p=>p.el.classList.remove('peek')));
function syncChecks(recId,i,j,on,src){S.panes.forEach(p=>{if(p.active!==recId) return; const b=p.el.querySelector(`[data-act="chk"][data-i="${i}"][data-j="${j}"]`); if(b&&b!==src){b.classList.toggle('off',!on);}});}

function toggleSidebar(){S.sidebarOpen=!S.sidebarOpen;if(S.sidebarOpen&&S.sidebarW<180)S.sidebarW=SB_DEF;layoutAll();}
$('#sbToggle').addEventListener('click',toggleSidebar);

/* toast */
let toastT; const toastEl=$('#toast');
function toast(msg,btn='',fn=null){
  toastEl.querySelector('span').textContent=msg;
  const b=toastEl.querySelector('button'); b.textContent=btn; b.onclick=fn?()=>{fn();toastEl.classList.remove('show');}:null;
  toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),btn?4200:2200);
}
function hideHint(){$('#hint').classList.add('hide');}
setTimeout(hideHint,14000);

/* ================= boot ================= */
$('#ico-rec').innerHTML=I.record; $('#ico-act').innerHTML=I.actions; $('#sbToggle').innerHTML=I.side;
renderSidebar();
const first=mkPane('r1'); S.panes.push(first); mountPane(first); ws.appendChild(gAct); S.focus=first.id; first.el.classList.add('focus');
renderTabs(first); renderContent(first,false);
document.body.classList.add('resizing'); layoutAll(); requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove('resizing')));
stagger($$('[data-stg]',first.el.querySelector('.doc')));
syncSidebar(true);
window.__S=S;
</script>
</body>
