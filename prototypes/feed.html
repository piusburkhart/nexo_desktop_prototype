<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logi Nexo Desktop — Feed &amp; Actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
/* ============ Nexo DS tokens (Nexo-DS-WIP) ============ */
:root{
  --gray-50:#F5F4F2; --gray-100:#F3F1ED; --gray-200:#E5E2E0; --gray-300:#D9D6D4; --gray-400:#C7C4C3; --gray-500:#BEBDBB;
  --gray-600:#A19F9A; --gray-700:#7E7C78; --gray-800:#555451; --gray-900:#343331; --gray-950:#252422; --gray-975:#1B1B1B;
  --accent-blue:#3A39FF; --accent-orange:#FF6D0F; --accent-green:#00A834; --accent-tomato:#E84A1F; --accent-lime:#B1FF99;

  --bg-window:var(--gray-300); --bg-canvas:var(--gray-200); --bg-surface:#FFFFFF; --bg-surface-subtle:var(--gray-50);
  --bg-surface-pressed:var(--gray-200); --bg-inverse:var(--gray-975);
  --text-primary:var(--gray-975); --text-secondary:var(--gray-900); --text-tertiary:var(--gray-800); --text-disabled:var(--gray-500); --text-inverse:#FFFFFF;
  --border-subtle:var(--gray-200); --border-default:var(--gray-300); --border-strong:var(--gray-600); --border-surface:#FFFFFF;
  --icon-primary:var(--gray-975); --icon-secondary:var(--gray-900);
  --on-accent-dark:var(--gray-975); --on-accent-light:#FFFFFF;
  --hover:var(--gray-300);
  --hit:rgba(177,255,153,.42); --hit-soft:rgba(177,255,153,.18);

  --shadow-xs:0 4px 12px rgba(0,0,0,.06);
  --shadow-s:0 8px 16px 5px rgba(0,0,0,.02);
  --shadow-xl:0 11px 25px rgba(0,0,0,.08),0 46px 46px rgba(0,0,0,.07),0 103px 62px rgba(0,0,0,.04),0 183px 73px rgba(0,0,0,.01);
  --shadow-edge:0 1px 0 var(--border-subtle);

  --s-2xs:2px; --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:24px; --s-2xl:32px; --s-3xl:64px; --s-4xl:64px;
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-2xl:32px; --r-3xl:40px; --r-4xl:48px; --r-full:999px;

  --d-fast:150ms; --d-std:300ms; --d-emph:550ms;
  --e-std:cubic-bezier(0,0,.58,1); --e-emph:cubic-bezier(.4,0,.2,1); --e-sym:cubic-bezier(.42,0,.58,1);

  --font-sans:"Brown Logitech Pan","Figtree","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-serif:"Domaine Text","Newsreader",Georgia,"Times New Roman",serif;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-window:#111111; --bg-canvas:var(--gray-975); --bg-surface:var(--gray-950); --bg-surface-subtle:var(--gray-900);
    --bg-surface-pressed:var(--gray-800); --bg-inverse:var(--gray-50);
    --text-primary:var(--gray-50); --text-secondary:var(--gray-400); --text-tertiary:var(--gray-600); --text-disabled:var(--gray-700); --text-inverse:var(--gray-975);
    --border-subtle:var(--gray-900); --border-default:var(--gray-800); --border-strong:var(--gray-700); --border-surface:var(--gray-950);
    --icon-primary:var(--gray-50); --icon-secondary:var(--gray-500); --hover:var(--gray-900);
    --hit:rgba(177,255,153,.2); --hit-soft:rgba(177,255,153,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-window:#111111; --bg-canvas:var(--gray-975); --bg-surface:var(--gray-950); --bg-surface-subtle:var(--gray-900);
  --bg-surface-pressed:var(--gray-800); --bg-inverse:var(--gray-50);
  --text-primary:var(--gray-50); --text-secondary:var(--gray-400); --text-tertiary:var(--gray-600); --text-disabled:var(--gray-700); --text-inverse:var(--gray-975);
  --border-subtle:var(--gray-900); --border-default:var(--gray-800); --border-strong:var(--gray-700); --border-surface:var(--gray-950);
  --icon-primary:var(--gray-50); --icon-secondary:var(--gray-500); --hover:var(--gray-900);
  --hit:rgba(177,255,153,.2); --hit-soft:rgba(177,255,153,.08);
  color-scheme:dark;
}

/* type styles */
.t-heading-xl{font-size:28px;line-height:34px;letter-spacing:-.56px;font-weight:400}
*,*::before,*::after{box-sizing:border-box}
:root{--ap-w:360px;--ap-pad:10px}   /* actions panel width and the side padding of its list */
/* Corner smoothing (squircle ≈ iOS continuous corners) on the recording cards and the recordings panel only (nothing action-related).
   Browsers without corner-shape fall back to plain round corners. */
@supports (corner-shape: squircle){
  .card,.main,.card::after{corner-shape:squircle}   /* ::after is the hover shadow layer: it must share the card's shape or the corners seem to change on hover */
}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg-window);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:17px;-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--text-primary);outline-offset:2px;border-radius:var(--r-md)}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.scroll-x{height:100%;overflow-x:auto;overflow-y:hidden}

/* ---------- window ---------- */
.win{height:100%;min-width:1120px;display:flex;flex-direction:column}
.top{height:88px;flex:none;position:relative}
.lights{position:absolute;left:24px;top:24px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#FE5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.search{position:absolute;left:160px;top:20px;width:320px;height:48px;border-radius:var(--r-full);background:var(--bg-surface);display:flex;align-items:center;gap:var(--s-sm);padding:0 var(--s-lg);color:var(--text-tertiary);font-size:14px;line-height:17px}
.search .ic{color:var(--icon-primary)}
.me{position:absolute;right:var(--s-lg);top:20px;width:48px;height:48px;border-radius:var(--r-full);background:var(--bg-inverse);color:var(--text-inverse);display:grid;place-items:center;font-size:18px;line-height:16px;letter-spacing:-.36px}
.body{flex:1;min-height:0;display:flex;gap:var(--s-sm);padding:0 var(--s-sm) var(--s-sm)}
.main{flex:1;min-width:0;background:var(--bg-canvas);border-radius:var(--r-2xl);display:flex;overflow:hidden}

/* ---------- sidebar ---------- */
.side{position:relative;width:248px;flex:none;border-right:1px solid var(--border-default);padding:var(--s-3xl) var(--s-lg) 0 var(--s-xl);overflow:hidden}
.navpill{position:absolute;left:0;top:0;width:0;height:0;border-radius:var(--r-full);background:var(--bg-inverse);pointer-events:none;transition:transform var(--d-std) var(--e-emph),width var(--d-std) var(--e-emph),height var(--d-std) var(--e-emph)}
.navpill.instant{transition:none}
.nav{position:relative;z-index:1;display:inline-flex;align-items:center;gap:var(--s-md);height:40px;padding:0 var(--s-lg);border-radius:var(--r-full);font-size:16px;line-height:22px;color:var(--text-primary);white-space:nowrap;transition:color var(--d-fast) var(--e-std),background-color var(--d-fast) var(--e-std)}
.nav:not(.on) .ic{color:var(--icon-secondary)}
.nav:hover:not(.on){background:var(--hover)}
.nav.on{color:var(--text-inverse)}
.side .nav.on .ic{color:var(--text-inverse)}
.navrec{height:48px;gap:var(--s-sm);padding:0 var(--s-xl) 0 var(--s-lg)}
.navrec:not(.on) .ic{color:var(--icon-primary)}
.fl li{display:block!important;height:auto!important;padding:0!important;background:none!important}
.sh{font-size:14px;line-height:17px;color:var(--text-secondary);font-weight:400;margin:var(--s-3xl) 0 var(--s-sm) var(--s-lg)}
.sl{list-style:none;margin:0;padding:0}
.sl li{display:flex;gap:var(--s-md);align-items:center;height:40px;padding:0 var(--s-lg);border-radius:var(--r-full);font-size:16px;line-height:22px;transition:background-color var(--d-fast) var(--e-std)}
.sl li:hover{background:var(--hover)}
.sl .ic{color:var(--icon-secondary)}
.pav{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;line-height:12px;font-weight:500}
.seeall{display:inline-block;font-size:12px;line-height:14px;color:var(--text-tertiary);text-decoration:underline;text-underline-offset:3px;margin:var(--s-xs) 0 0 var(--s-lg);cursor:pointer}

/* ---------- stage ---------- */
.stage{flex:1;min-width:0;position:relative}
.view{position:absolute;inset:0}
.feed{overflow:auto;padding:var(--s-3xl) var(--s-2xl) 64px;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed.away{visibility:hidden;pointer-events:none}
.fcol{max-width:548px;margin:0 auto}
.fh{font-size:28px;line-height:34px;letter-spacing:-.56px;font-weight:400;margin:0 0 var(--s-2xl);min-height:40px;display:flex;align-items:center}
.fh .ic{width:32px;height:32px;margin-right:var(--s-md);flex:none;stroke-width:1.5}
.fempty{font-size:14px;line-height:17px;color:var(--text-tertiary);margin:0}
.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s-2xl)}
.seg{display:flex;background:var(--border-default);border-radius:var(--r-full);padding:var(--s-2xs)}
.seg button{width:44px;height:32px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--icon-secondary);transition:background-color var(--d-fast) var(--e-std),color var(--d-fast) var(--e-std)}
.seg button.on{background:var(--bg-surface);color:var(--icon-primary);box-shadow:var(--shadow-xs)}
.seg .ic{width:20px;height:20px}
.tools .r{display:flex;gap:var(--s-lg);color:var(--icon-primary)}
.sec{font-size:14px;line-height:17px;color:var(--text-secondary);font-weight:400;margin:0 0 var(--s-md)}
.cards{display:flex;flex-direction:column;gap:var(--s-md);margin-bottom:var(--s-2xl)}
.card{position:relative;background:var(--bg-surface);border-radius:var(--r-3xl);padding:var(--s-xl);width:100%;box-shadow:var(--shadow-s);cursor:pointer;outline-offset:3px;transition:translate var(--d-std) var(--e-std),scale var(--d-std) var(--e-std),opacity var(--d-std) var(--e-std)}
/* elevation is a pre-painted layer that only fades — box-shadow itself never animates */
.card::after,.ai::after,.ri::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:var(--shadow-xl);opacity:0;pointer-events:none;transition:opacity var(--d-std) var(--e-std)}
.card.hot{translate:0 -2px;scale:1.01}
.card.hot::after{opacity:1}
.feed.linking .card:not(.hot){opacity:.58}
.card .lgw{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows 200ms var(--e-std),opacity 200ms var(--e-std),visibility 0s linear 200ms}
/* lagom layout: summary rows expand from 0 to their natural height (and collapse back) in 200ms */
.feed.layout-lagom .card .lgw{grid-template-rows:1fr;opacity:1;visibility:visible;transition-delay:0s}
.card .lg{min-height:0;overflow:hidden;font-size:18px;line-height:26px}
.card .lg>div{padding-top:var(--s-xl)}   /* padding lives inside the clipped box so it collapses to 0 too */
.card .lg p{margin:0 0 var(--s-lg)}
.card .lg p:last-child{margin-bottom:var(--s-xs)}
.card .t{font-size:16px;line-height:22px;display:flex;justify-content:space-between;align-items:center;gap:var(--s-lg);margin-bottom:var(--s-sm)}
.card.memo{padding:var(--s-2xl) var(--s-xl)}
.card.memo .q{font-family:var(--font-serif);font-weight:300;font-size:20px;line-height:33px;letter-spacing:-.4px;margin:0 0 var(--s-lg)}
.tag{display:inline-flex;align-items:center;height:24px;background:var(--accent-lime);color:var(--on-accent-dark);font-size:12px;line-height:14px;padding:0 var(--s-sm);border-radius:var(--r-sm);flex:none}
.meta{display:flex;align-items:center;gap:var(--s-sm);font-size:12px;line-height:14px;color:var(--text-secondary);flex-wrap:wrap}
.meta .mi{display:inline-flex;align-items:center;gap:var(--s-xs)}
.meta .ic{width:16px;height:16px;color:var(--icon-secondary)}
.avs{display:inline-flex}
.avs i{width:20px;height:20px;border-radius:var(--r-full);display:grid;place-items:center;font-style:normal;font-size:10px;line-height:12px;font-weight:500;box-shadow:0 0 0 1.5px var(--border-surface);margin-left:-8px}
.avs i:first-child{margin-left:0}
.avs i.more{width:auto;min-width:22px;padding:0 var(--s-xs)}

/* ---------- detail ---------- */
.detail{display:flex;flex-direction:column;padding:var(--s-3xl) var(--s-lg) 0}
.dhead{height:40px;display:flex;align-items:center;flex:none;margin-bottom:var(--s-lg)}
.back{display:inline-flex;align-items:center;gap:var(--s-sm);height:40px;font-size:16px;line-height:22px;padding:0 var(--s-sm);border-radius:var(--r-full);transition:color var(--d-fast) var(--e-std),background-color var(--d-fast) var(--e-std)}
.back:hover{background:var(--hover)}
.back:active{color:var(--text-secondary)}
.sheet{flex:1;min-height:0;background:var(--bg-surface);border-radius:var(--r-3xl) var(--r-3xl) 0 0;display:flex;position:relative;overflow:hidden;box-shadow:var(--shadow-s)}
.sheet.notrans *{transition:none!important}
.shell{position:absolute;background:var(--bg-surface);pointer-events:none;contain:strict}
.sum{contain:layout paint}
.sum{flex:1;min-width:0;overflow:auto;padding:64px var(--s-4xl) 80px;scrollbar-width:thin}
.sum-in{--w:clamp(450px,70%,760px);max-width:var(--w);margin-left:0;transition:margin-left var(--d-emph) var(--e-emph)}
.sheet:not(.tx-open) .sum-in{margin-left:max(0px,calc((100% - var(--w)) / 2))}
.round{width:40px;height:40px;border-radius:var(--r-full);background:var(--bg-surface-subtle);display:grid;place-items:center;color:var(--icon-primary);transition:background-color var(--d-fast) var(--e-std)}
.round:hover{background:var(--bg-surface-pressed)}
.txbtn{position:absolute;top:var(--s-xl);right:var(--s-xl);transition:opacity var(--d-fast) var(--e-std),transform var(--d-std) var(--e-std),background-color var(--d-fast) var(--e-std)}
.tx-open .txbtn{opacity:0;transform:scale(.9);pointer-events:none}
.d-title{font-size:20px;line-height:25px;letter-spacing:-.4px;font-weight:400;margin:0 0 var(--s-sm)}
.lagom{font-size:22px;line-height:30px;margin-top:var(--s-2xl)}
.lagom p{margin:0 0 var(--s-xl)}
.lagom p:last-child{margin:0}
.memo-big{font-family:var(--font-serif);font-weight:300;font-size:20px;line-height:33px;letter-spacing:-.4px;margin:var(--s-2xl) 0 0}
.sum hr{border:0;border-top:1px solid var(--border-subtle);margin:var(--s-3xl) 0}
.topic{margin-bottom:var(--s-3xl)}
.topic h3{font-size:20px;line-height:25px;letter-spacing:-.4px;font-weight:400;margin:0 0 var(--s-xl)}
.topic h4{font-size:14px;line-height:17px;color:var(--text-secondary);font-weight:400;margin:0 0 var(--s-sm)}
.topic p{font-family:var(--font-serif);font-weight:300;font-size:16px;line-height:30px;letter-spacing:.16px;color:var(--text-primary);margin:0 0 var(--s-md)}
.topic .sub{margin-bottom:var(--s-xl)}
.topic .sub:last-child{margin-bottom:0}
/* Timestamp chip: Default sits on Shadow/Edge; pressed drops the edge (150ms, ease out) */
.cite{display:inline-flex;align-items:center;height:22px;padding:var(--s-xs) var(--s-sm);border-radius:var(--r-full);border:1px solid var(--border-subtle);background:var(--bg-surface);box-shadow:var(--shadow-edge);font-family:var(--font-sans);font-size:12px;line-height:14px;letter-spacing:0;color:var(--text-primary);vertical-align:2px;margin-left:var(--s-xs);transition:box-shadow var(--d-fast) var(--e-std),background-color var(--d-fast) var(--e-std),border-color var(--d-fast) var(--e-std)}
.cite:hover{border-color:var(--border-default)}
.cite:active,.cite.on{box-shadow:none;background:var(--bg-surface-pressed);border-color:var(--border-default)}

.txw{width:0;flex:none;position:relative;overflow:hidden;transition:width var(--d-emph) var(--e-emph)}
.tx-open .txw{width:416px}
.tx{position:absolute;top:var(--s-lg);left:0;bottom:0;width:400px;border:1px solid var(--border-subtle);border-bottom:0;border-radius:var(--r-2xl) var(--r-2xl) 0 0;display:flex;flex-direction:column;background:var(--bg-surface);opacity:0;transform:translateX(24px);transition:opacity var(--d-fast) var(--e-std),transform var(--d-emph) var(--e-emph)}
.tx-open .tx{opacity:1;transform:none;transition:opacity var(--d-std) var(--e-std) var(--d-fast),transform var(--d-emph) var(--e-emph)}
.txh{height:64px;flex:none;display:grid;place-items:center;font-size:16px;line-height:22px;position:relative}
.txh .round{position:absolute;right:var(--s-md);top:var(--s-md);background:none;box-shadow:inset 0 0 0 1px var(--border-subtle)}
.txh .round:hover{background:var(--bg-surface-subtle)}
.txs{flex:1;overflow:auto;padding:var(--s-sm) var(--s-xl) 0;position:relative;scrollbar-width:thin}
.txs::after{content:"";display:block;height:55vh}
/* Transcript segment: speaker row, 12px, text; 32px between segments */
.tl{padding:var(--s-md);margin:0 calc(var(--s-md) * -1) var(--s-sm);border-radius:var(--r-xl);transition:background-color var(--d-std) var(--e-std)}
.tl .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s-md)}
.spk{height:40px;border:1px solid var(--border-subtle);background:var(--bg-surface);border-radius:var(--r-full);padding:var(--s-xs) var(--s-lg) var(--s-xs) var(--s-xs);display:inline-flex;align-items:center;gap:var(--s-sm);font-size:12px;line-height:14px}
.spk b{width:32px;height:32px;border-radius:var(--r-full);border:1px solid var(--border-subtle);display:grid;place-items:center;font-weight:400}
.spk .ic{width:20px;height:20px}
.tl .tm{font-size:14px;line-height:17px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.tl p{font-family:var(--font-serif);font-weight:300;font-size:16px;line-height:30px;letter-spacing:.16px;margin:0}
.tl.hit{background:var(--hit);transition:background-color var(--d-fast) var(--e-std)}
.tl.hit.settle{background:var(--hit-soft);transition:background-color 1200ms var(--e-sym)}

/* ---------- action panel ---------- */
.ap{flex:none;width:var(--ap-w);background:var(--bg-canvas);border-radius:var(--r-2xl);position:relative;overflow:hidden;transition:width var(--d-emph) var(--e-emph)}
.ap.collapsed{width:96px}
.ap .layer{position:absolute;top:0;right:0;bottom:0;display:flex;flex-direction:column}
.full{width:var(--ap-w);transition:opacity var(--d-std) var(--e-std) var(--d-fast)}
.collapsed .full{opacity:0;pointer-events:none;transition:opacity var(--d-fast) var(--e-std)}
.rail{width:96px;align-items:center;opacity:0;pointer-events:none;transition:opacity var(--d-fast) var(--e-std)}
.collapsed .rail{opacity:1;pointer-events:auto;transition:opacity var(--d-std) var(--e-std) var(--d-fast)}
.tog{width:40px;height:40px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--icon-primary);transition:background-color var(--d-fast) var(--e-std)}
.tog:hover{background:var(--hover)}
.full-head{padding:var(--s-lg) var(--s-lg) 0;flex:none}
.full-head .tog{margin-left:calc(var(--s-sm) * -1)}
.ap-title{font-size:18px;line-height:22px;letter-spacing:-.36px;font-weight:400;margin:var(--s-xl) 0 0}
.chips{display:flex;gap:var(--s-sm);margin-top:var(--s-lg)}
/* App Header / Tab: 32px pill; Selected = bg/inverse, Unselected = canvas + border/strong */
.chip{height:32px;border-radius:var(--r-full);border:1px solid var(--border-strong);background:var(--bg-canvas);padding:0 var(--s-md);font-size:14px;line-height:17px;display:inline-flex;align-items:center;gap:var(--s-xs);white-space:nowrap;transition:background-color var(--d-fast) var(--e-std),color var(--d-fast) var(--e-std),border-color var(--d-fast) var(--e-std)}
.chip:hover{border-color:var(--text-primary)}
.chip.on{background:var(--bg-inverse);color:var(--text-inverse);border-color:var(--bg-inverse)}
.chip .ic{width:16px;height:16px;stroke-width:2}
.listwrap{flex:1;min-height:0;position:relative}
.list{position:absolute;inset:0;overflow:auto;padding:var(--s-xl) var(--ap-pad) 96px;scrollbar-width:none}
/* bottom fade as a static overlay (a mask would repaint the whole list on every animated frame) */
.listwrap::before{content:"";position:absolute;left:0;right:0;top:0;height:32px;background:linear-gradient(to top,transparent,var(--bg-canvas));pointer-events:none;z-index:2}
.listwrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(to bottom,transparent,var(--bg-canvas));pointer-events:none;z-index:2}
.list::-webkit-scrollbar{display:none}
.grp{margin-bottom:var(--s-xl)}
.gh{display:flex;justify-content:space-between;align-items:center;padding:0 var(--s-md);height:22px;font-size:14px;line-height:17px;margin-bottom:var(--s-md)}
.gh .l{display:flex;gap:var(--s-xs);align-items:center}
.gh .l .ic{width:16px;height:16px;color:var(--icon-secondary)}
.gh .t{color:var(--text-tertiary)}
/* Action button: 76px pill, 2px border/subtle, 4px padding, 64px app icon, Shadow/XS */
.ai{position:relative;height:76px;border-radius:38px;background:var(--bg-surface);padding:6px;margin-bottom:var(--s-sm);box-shadow:inset 0 0 0 2px var(--border-subtle),var(--shadow-xs);cursor:pointer}
.ai:last-child{margin-bottom:0}
.ai .row{display:flex;align-items:center;gap:var(--s-sm);height:64px}
.aic{width:64px;height:64px;border-radius:var(--r-full);background:var(--bg-surface-subtle);display:grid;place-items:center;flex:none}
.aic img,.ri img,.flyic img{width:32px;height:32px;display:block;object-fit:contain}
.ait{flex:1;min-width:0}
.ait .n{font-size:16px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ait .m{font-size:12px;line-height:14px;color:var(--text-tertiary);display:flex;gap:var(--s-sm);margin-top:var(--s-2xs);align-items:center}
.ait .m span{display:inline-flex;gap:var(--s-xs);align-items:center}
.ait .m .ic{width:12px;height:12px}
.ai .tag{margin:0 var(--s-xl) 0 var(--s-sm)}
.ai.done .n{color:var(--text-disabled);text-decoration:line-through;text-decoration-color:var(--text-disabled)}
.ai.done .aic img{opacity:.5}
.empty{margin:0 var(--s-xs);font-size:14px;line-height:17px;color:var(--text-tertiary)}
/* action detail: hovering/clicking an action opens it in place as a card, always inside the panel */
.ai .det{display:none}
.ai.open{overflow:hidden;z-index:60;padding:0;transition:box-shadow 300ms var(--e-std),opacity var(--d-std) var(--e-std),scale var(--d-std) var(--e-std),translate var(--d-std) var(--e-std)}
.ai.open{height:auto;border-radius:var(--r-3xl);cursor:default;box-shadow:var(--shadow-xl)}
/* the compact row and the detail card crossfade while the box grows/shrinks */
.ai.open .row{position:absolute;left:6px;right:6px;top:6px;pointer-events:none}
.ai.open .det{display:block}
.ai.open::after{display:none}
.ai .det{padding:0 0 var(--s-lg)}
/* the icon disc is the pill's disc (64px, 6px from the corner), so it stays put while the pill turns into the card */
.dtop{display:flex;justify-content:space-between;align-items:center;padding:6px var(--s-lg) 0 6px}
.dic{width:64px;height:64px;border-radius:var(--r-full);background:var(--bg-surface-subtle);display:grid;place-items:center}
.dic img{width:32px;height:32px;object-fit:contain;display:block}
.dt{font-size:18px;line-height:22px;letter-spacing:-.36px;margin:var(--s-lg) var(--s-lg);cursor:pointer}
.db{position:relative;font-size:14px;line-height:22px;max-height:340px;overflow:hidden;margin:0 var(--s-lg)}
.db::after{content:"";position:absolute;left:0;right:0;bottom:0;height:88px;background:linear-gradient(to bottom,transparent,var(--bg-surface) 72%)}
.dl{display:flex;gap:var(--s-sm);align-items:center;margin-bottom:var(--s-xs);color:var(--text-secondary)}
.dl b{font-weight:400;color:var(--text-primary)}
.dl .avs i{width:28px;height:28px;font-size:11px}
.db p{margin:var(--s-xl) 0 0}
.dfoot{margin:-46px var(--s-lg) 0;position:relative;z-index:1}
.dbtn{width:100%;height:46px;border-radius:var(--r-full);border:1px solid var(--border-default);background:var(--bg-surface-subtle);font-size:14px;line-height:17px;text-align:center;transition:background-color var(--d-fast) var(--e-std)}
.dbtn:hover{background:var(--bg-surface-pressed)}
.dbtn:disabled{color:var(--text-tertiary);cursor:default;background:var(--bg-surface-subtle)}
.note{position:absolute;left:50%;top:var(--s-sm);transform:translate(-50%,-4px);height:28px;display:flex;align-items:center;background:var(--bg-inverse);color:var(--text-inverse);font-size:12px;line-height:14px;padding:0 var(--s-md);border-radius:var(--r-full);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--d-std) var(--e-std),transform var(--d-std) var(--e-std);z-index:6;max-width:344px;overflow:hidden;text-overflow:ellipsis}
.note.show{opacity:1;transform:translate(-50%,0)}

/* rail */
.rail .tog{margin-top:var(--s-lg)}
.rm{height:16px;margin:27px 0 3px;display:grid;place-items:center;color:var(--icon-secondary);flex:none}
.rm:first-child{margin-top:9px}
.rm .ic{width:16px;height:16px}
.flym{position:fixed;width:16px;height:16px;pointer-events:none;color:var(--icon-secondary)}
.flym .ic{width:16px;height:16px}
.badge{margin-top:66px;min-width:32px;height:24px;border-radius:var(--r-full);background:var(--bg-inverse);color:var(--text-inverse);font-size:12px;line-height:14px;display:grid;place-items:center;padding:0 var(--s-sm);font-variant-numeric:tabular-nums;flex:none}
.rlist{margin-top:var(--s-xl);display:flex;flex-direction:column;gap:var(--s-lg);align-items:center;overflow:auto;flex:1;width:100%;padding:var(--s-xs) 0 var(--s-2xl);scrollbar-width:none}
.rlist::-webkit-scrollbar{display:none}
/* Action button / Swipe action: 76px circle, bg/surface, 2px border/subtle */
.ri{position:relative;width:76px;height:76px;border-radius:var(--r-full);background:var(--bg-surface);box-shadow:inset 0 0 0 2px var(--border-subtle),var(--shadow-xs);display:grid;place-items:center;flex:none;cursor:pointer}
/* collapsed-rail action, three states: circle (rail icon) → pill (hover) → card (click).
   One floating element morphs between them; the card is handed to the real list item once the panel is open. */
#rpeek{position:fixed;z-index:70;width:76px;height:76px;border-radius:38px;background:var(--bg-surface);box-shadow:inset 0 0 0 2px var(--border-subtle),var(--shadow-xs);overflow:hidden;cursor:pointer;
  transition:width 460ms cubic-bezier(.22,1,.36,1),height 520ms cubic-bezier(.22,1,.36,1),top 260ms cubic-bezier(.4,0,.2,1),right 520ms cubic-bezier(.22,1,.36,1),border-radius 520ms cubic-bezier(.22,1,.36,1),box-shadow 400ms cubic-bezier(.4,0,.2,1)}
#rpeek:not(.on):not(.asCard){transition-duration:300ms,300ms,200ms,300ms,300ms,300ms;transition-timing-function:cubic-bezier(.4,0,.2,1)}   /* leaving the pill: calmer ease-in-out */
#rpeek[hidden]{display:none}
#rpeek .rrow{position:absolute;left:6px;top:6px;height:64px;display:flex;align-items:center;gap:var(--s-sm);transition:opacity 160ms var(--e-std)}
#rpeek .rpic{width:64px;height:64px;border-radius:var(--r-full);flex:none;display:grid;place-items:center;background:transparent;transition:background-color 240ms var(--e-std)}
#rpeek.on .rpic,#rpeek.asCard .rpic{background:var(--bg-surface-subtle)}
#rpeek .rpic img{width:32px;height:32px;object-fit:contain;display:block}
#rpeek .rpt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:16px;line-height:22px;white-space:nowrap;padding-right:var(--s-md);opacity:0;transition:opacity 140ms var(--e-std)}
#rpeek .rptag{margin-right:var(--s-xl);opacity:0;transition:opacity 140ms var(--e-std)}
#rpeek .rptag[hidden]{display:none}
#rpeek.on .rpt,#rpeek.on .rptag{opacity:1;transition:opacity 260ms var(--e-std) 140ms}
#rpeek.asCard .rptag{opacity:0}
#rpeek.done .rpic img{opacity:.5}
#rpeek.done .rpt{color:var(--text-disabled);text-decoration:line-through}
#rpeek .rdet{position:absolute;right:0;top:0;width:calc(var(--ap-w) - 2 * var(--ap-pad));padding:0 0 var(--s-lg);opacity:0;pointer-events:none;transition:opacity 160ms var(--e-std)}
#rpeek.asCard{border-radius:var(--r-3xl);box-shadow:var(--shadow-xl);cursor:default}
#rpeek.asCard .rrow{opacity:0;pointer-events:none}
#rpeek.asCard .rdet{opacity:1;pointer-events:auto;transition:opacity 260ms var(--e-std) 160ms}
.ri.done img{opacity:.5}
.rempty{font-size:12px;line-height:14px;color:var(--text-tertiary);text-align:center;padding:0 var(--s-sm)}

/* hover link: everything not connected to the focused recording fades like the unhovered cards */
.ai,.ri,.gh{transition:opacity var(--d-std) var(--e-std),scale var(--d-std) var(--e-std),translate var(--d-std) var(--e-std)}
.focusing .ai.match,.focusing .ri.match,.focusing .gh.match,.focusing .ai.match::after,.focusing .ri.match::after{transition-delay:calc(var(--mi,0) * 30ms)}
.focusing .ai:not(.match),.focusing .gh:not(.match),.focusing .ri:not(.match){opacity:.58}
.focusing .ai.match{translate:-4px 0}
.focusing .ri.match{scale:1.04}
.focusing .ai.match::after,.focusing .ri.match::after{opacity:1}

/* overlays */
.ghosts{position:absolute;inset:0;pointer-events:none;z-index:5}
#fly{position:fixed;inset:0;pointer-events:none;z-index:60}
.flyai{position:fixed;margin:0;padding:6px;overflow:hidden;pointer-events:none;cursor:default}
.flyai .row{position:static}
.flyic{position:fixed;border-radius:var(--r-full);display:grid;place-items:center;background:var(--bg-surface-subtle)}
.hid{visibility:hidden}
/* drag & drop: recordings onto folders */
.card.dragging{opacity:.4}
.card.leaving{overflow:hidden}
.nav.drop{box-shadow:inset 0 0 0 2px var(--text-primary);background:var(--hover)}
.nav.on.drop{background:none}
#toast{position:fixed;left:50%;bottom:32px;z-index:70;transform:translate(-50%,8px);background:var(--bg-inverse);color:var(--text-inverse);font-size:14px;line-height:17px;padding:var(--s-md) var(--s-xl);border-radius:var(--r-full);pointer-events:none;opacity:0;transition:opacity var(--d-std) var(--e-std),transform var(--d-std) var(--e-std);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important;animation-duration:.01ms!important}
}
</style>

rp.addEventListener('pointerleave', e => { if (!(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.ri'))) hidePeek(); });
$('#rlist').addEventListener('focusin', e => { const r = e.target.closest('.ri'); if (r && state.collapsed) showPeek(r); });
$('#rlist').addEventListener('focusout', () => hidePeek());
$('#rlist').addEventListener('scroll', () => hidePeek(true));

/* ---------------- chips ---------------- */
$('#chips').addEventListener('click', e => {
  const ch = e.target.closest('.chip'); if (!ch) return;
  if (ch.id === 'scopeChip') return relayout(() => { if (state.scope) state.scope = null; else state.fscope = false; applyVis(); });
  const f = ch.dataset.filter;
  closeAction(true);                                  // All/Done switches instantly, no list animation
  if (f === 'all') { state.scope = null; state.fscope = false; }
  state.filter = f; list.scrollTop = 0; applyVis();
});
/* ---------------- action detail: open in place inside the panel ---------------- */
let openT = 0, closeT = 0;
const OPEN_MS = 460, CLOSE_MS = 340;
const SPRING = [.32,.72,0,1], SPRING_CSS = 'cubic-bezier(.32,.72,0,1)';   // fast start, long soft landing (iOS-like)
const cancelAnims = el => el.getAnimations().forEach(x => x.cancel());
let morphing = false, morphT = 0;

/* The list is re-laid-out in ONE step and everything is animated from its old position to its new one with
   transforms (FLIP): cards below the action, the group headers and the scrolling all move together on a single
   clock, instead of the layout being re-computed every frame. */
function morphList(mutate, ms, ease = SPRING_CSS){
  const els = $$('.gh, .ai, .empty', list).filter(e => e.getClientRects().length);
  const before = els.map(e => e.getBoundingClientRect().top);                 // visual position, including running animations
  els.forEach(e => e.getAnimations().filter(x => x.id === 'flip').forEach(x => x.cancel()));
  mutate();
  els.forEach((e, i) => {
    const d = before[i] - e.getBoundingClientRect().top;
    if (Math.abs(d) > .5) e.animate([{transform:`translateY(${d}px)`},{transform:'none'}], {id:'flip', duration:D(ms), easing:ease});
  });
  morphing = true; clearTimeout(morphT); morphT = setTimeout(() => { morphing = false; }, D(ms) + 40);
}
function collapseEl(a){                      // pure state change: the open card becomes a pill again
  a.classList.remove('open'); a.setAttribute('aria-expanded', 'false');
  a.querySelector('.db').style.maxHeight = '';
  [$('.row', a), $('.det', a)].forEach(cancelAnims);
  a.getAnimations().filter(x => x.id === 'clip').forEach(x => x.cancel());
}
function foldGhost(a, rect, ms){             // the closing card, as a floating copy that shrinks into the pill and fades out
  const g = a.cloneNode(true);
  g.removeAttribute('data-aid'); g.removeAttribute('tabindex'); $('.row', g).style.opacity = 0;
  Object.assign(g.style, {position:'fixed', left:rect.left+'px', top:rect.top+'px', width:rect.width+'px', height:rect.height+'px', margin:0, zIndex:60, pointerEvents:'none', transition:'none'});
  document.body.appendChild(g);
  const cut = Math.max(0, rect.height - 76);
  const k = g.animate([{clipPath:'inset(-80px round 40px)', opacity:1},{clipPath:`inset(0 0 ${cut}px 0 round 38px)`, opacity:1, offset:.7},{clipPath:`inset(0 0 ${cut}px 0 round 38px)`, opacity:0}],
    {duration:D(ms), easing:SPRING_CSS, fill:'forwards'});
  k.onfinish = () => g.remove(); setTimeout(() => g.remove(), D(ms) + 100);
  return g;
}
function openAction(a, instant){
  if ((state.collapsed && !instant) || a.classList.contains('open')) return;
  clearTimeout(openT); clearTimeout(closeT);
  if (instant) {                             // hand-over from the floating card: no motion
    $$('.ai.open', list).forEach(collapseEl);
    a.classList.add('open'); a.setAttribute('aria-expanded', 'true'); fitDetail(a);
    $('.row', a).animate([{opacity:0},{opacity:0}], {duration:1, fill:'forwards'});
    return;
  }
  const prev = $('.ai.open', list), prevRect = prev && prev.getBoundingClientRect();
  const h0 = a.offsetHeight; let h1 = h0;
  if (prev) foldGhost(prev, prevRect, CLOSE_MS);   // the card that was open folds up as a floating copy while the new one opens
  morphList(() => {
    if (prev) collapseEl(prev);
    a.classList.add('open'); a.setAttribute('aria-expanded', 'true'); fitDetail(a); h1 = a.offsetHeight;
    // scroll (in the same step) so the whole card ends up inside the panel
    const lr = list.getBoundingClientRect(), br = a.getBoundingClientRect();
    if (br.bottom > lr.bottom - 16) list.scrollTop += br.bottom - lr.bottom + 16;
    else if (br.top < lr.top + 8) list.scrollTop += br.top - lr.top - 8;
  }, OPEN_MS);
  // the card is laid out at full size straight away; a clip reveals it from the pill shape
  a.animate([{clipPath:`inset(0 0 ${h1 - h0}px 0 round 38px)`},{clipPath:'inset(-80px round 40px)'}], {id:'clip', duration:D(OPEN_MS), easing:SPRING_CSS});
  $('.row', a).animate([{opacity:1},{opacity:0}], {duration:D(160), easing:E_STD, fill:'forwards'});
  $('.det', a).animate([{opacity:0},{opacity:1}], {duration:D(260), delay:D(120), easing:E_STD, fill:'backwards'});
}
function fitDetail(a){                       // never taller than the panel: shrink the body preview until it fits
  const db = $('.db', a); db.style.maxHeight = '';
  const chrome = a.offsetHeight - db.offsetHeight, room = list.clientHeight - 32;
  if (a.offsetHeight > room) db.style.maxHeight = Math.max(24, room - chrome) + 'px';
}
function closeAction(instant){
  clearTimeout(openT); clearTimeout(closeT);
  const a = $('.ai.open', list); if (!a) return;
  if (instant) { collapseEl(a); return; }
  const rect = a.getBoundingClientRect();
  const g = foldGhost(a, rect, CLOSE_MS);
  morphList(() => collapseEl(a), CLOSE_MS);
  $('.row', a).animate([{opacity:0},{opacity:1}], {duration:D(200), delay:D(CLOSE_MS * .45), easing:E_STD, fill:'both'});
}
document.addEventListener('click', e => { if ($('.ai.open', list) && !e.target.closest('.ai.open, #rpeek')) closeAction(); });   // click anywhere else closes
list.addEventListener('keydown', e => { const a = e.target.closest('.ai'); if (a && e.target === a && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openAction(a); } });
list.addEventListener('click', e => {
  const b = e.target.closest('.dbtn');
  if (b) { const a = A[b.dataset.save]; b.textContent = APPS[a.app][1]; b.disabled = true; return; }
  const ai = e.target.closest('.ai'); if (!ai) return;
  if (ai.classList.contains('open')) { if (e.target.closest('.dtop, .dt')) closeAction(); }   // click the card's header to fold it up again
  else openAction(ai);
});

/* ---------------- recording detail ---------------- */
function citeHTML(t){ return t.replace(/\{(\d+:\d+)\}/g, (_, m) => `<button class="cite" data-s="${sec(m)}" aria-label="Show ${m} in transcription">${m}</button>`); }
function renderDetail(r){
  const meta = `<div class="meta"><span class="mi">${ic(r.memo?'chat':'mic')}${r.date}</span><span class="mi">${ic('folder')}${r.folder}</span>${r.memo?'':avs(r.more)}</div>`;
  let h = `<h2 class="d-title">${r.title}</h2>${meta}`;
  if (r.memo) h += `<p class="memo-big">${r.text}</p>`;
  else {
    h += `<div class="lagom">${r.lagom.map(p => `<p>${p}</p>`).join('')}</div><hr>`;
    h += r.topics.map(t => `<section class="topic"><h3>${t.h}</h3>${t.subs.map(s => `<div class="sub">${s.s?`<h4>${s.s}</h4>`:''}${s.ps.map(p => `<p>${citeHTML(p)}</p>`).join('')}</div>`).join('')}</section>`).join('');
  }
  $('#sumIn').innerHTML = h;
  txs.innerHTML = (r.tx || []).map(([s,t,x]) => `<div class="tl" data-s="${sec(t)}"><div class="row"><span class="spk"><b>${ic('plus')}</b>Speaker ${s}</span><span class="tm">${pad(t)}</span></div><p>${x}</p></div>`).join('');
  $('#txBtn').hidden = !!r.memo;
  $('#sum').scrollTop = 0; txs.scrollTop = 0;
}
let nav = 0;
const stage = $('#stage');
const navEls = () => [sheet, $('#sum'), $('.dhead'), $('#txBtn'), feed];
function settleNav(){
  // finish whatever transition is in flight so a new one always starts from a clean state
  navEls().forEach(el => el.getAnimations().forEach(a => a.cancel()));
  $$('#fly .card, .shell').forEach(g => g.remove());
  $$('.card').forEach(c => { c.style.visibility = ''; $('.ci', c).getAnimations().forEach(a => a.cancel()); });
  feed.style.willChange = ''; sheet.style.willChange = '';
}
function cardGhost(card, c){
  const g = card.cloneNode(true);
  g.classList.remove('hot');
  Object.assign(g.style, {position:'fixed', left:c.left+'px', top:c.top+'px', width:c.width+'px', height:c.height+'px', margin:0, zIndex:40, visibility:'visible', boxShadow:'none', translate:'none', scale:'none', opacity:1, transition:'none', pointerEvents:'none', background:'transparent'});
  $('#fly').appendChild(g);
  return g;
}
/* A content-free white "shell" morphs between the card and the sheet. It carries no text or shadow,
   so every frame is cheap; the real sheet only cross-fades (opacity, on the compositor). */
function makeShell(){
  const sh = document.createElement('div');
  sh.className = 'shell';
  stage.insertBefore(sh, detail);   // above the feed, below the detail view
  return sh;
}
const rel = (r, st) => ({left:(r.left - st.left)+'px', top:(r.top - st.top)+'px', width:r.width+'px', height:r.height+'px'});
function openRec(id){
  if (state.view !== 'feed') return;
  const my = ++nav; settleNav();
  clearTimeout(enterT); clearTimeout(leaveT); clearTimeout(scrollT);
  const r = R[id], card = feed.querySelector(`.card[data-rec="${id}"]`);
  const c = card.getBoundingClientRect(), st = stage.getBoundingClientRect();
  renderDetail(r);
  detail.hidden = false;
  state.view = 'detail'; state.rec = id;
  const s = sheet.getBoundingClientRect();
  const sh = makeShell();
  const g = cardGhost(card, c);
  card.style.visibility = 'hidden';
  feed.style.willChange = 'opacity'; sheet.style.willChange = 'opacity';
  g.animate([{opacity:1},{opacity:0}], {duration:D(DUR.fast), easing:E_STD, fill:'forwards'}).onfinish = () => g.remove();
  sh.animate([
    Object.assign(rel(c, st), {borderRadius:'40px'}),
    Object.assign(rel({left:s.left, top:s.top, width:s.width, height:Math.max(s.height, 1)}, st), {borderRadius:'40px 40px 0 0'})
  ], {duration:D(DUR.emph), easing:EASE, fill:'forwards'});
  feed.animate([{opacity:1},{opacity:0}], {duration:D(DUR.std), easing:E_STD, fill:'forwards'}).onfinish = () => {
    if (nav === my) { feed.classList.add('away'); feed.getAnimations().forEach(a => a.cancel()); feed.style.willChange = ''; }
  };
  // the real sheet fades in over the shell once the shell is most of the way there
  sheet.animate([{opacity:0},{opacity:1}], {duration:D(DUR.std), delay:D(DUR.emph - DUR.std + 50), easing:E_STD, fill:'backwards'}).onfinish = () => {
    if (nav === my) { sh.remove(); sheet.style.willChange = ''; }
  };
  $('#sum').animate([{transform:'translateY(8px)'},{transform:'none'}], {duration:D(DUR.std), delay:D(DUR.emph - DUR.std + 50), easing:E_STD, fill:'backwards'});
  $('.dhead').animate([{opacity:0, transform:'translateX(8px)'},{opacity:1, transform:'none'}], {duration:D(DUR.std), delay:D(DUR.fast), easing:E_STD, fill:'backwards'});
  // action panel work goes on the next frame so it doesn't share a frame with the view swap
  requestAnimationFrame(() => { if (nav === my) relayout(() => { setFocus(null); state.scope = id; list.scrollTop = 0; applyVis(); }); });
}
function goBack(){
  if (state.view !== 'detail') return;
  const my = ++nav; settleNav();
  const id = state.rec, card = feed.querySelector(`.card[data-rec="${id}"]`);
  if (state.tx) closeTx(true);
  feed.classList.remove('away');
  const s = sheet.getBoundingClientRect(), c = card.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const onScreen = c.bottom > st.top + 20 && c.top < st.bottom - 20;
  state.view = 'feed'; state.rec = null;
  feed.style.willChange = 'opacity'; sheet.style.willChange = 'opacity';
  feed.animate([{opacity:0},{opacity:1}], {duration:D(DUR.std), delay:D(DUR.fast), easing:E_STD, fill:'backwards'});
  $('.dhead').animate([{opacity:1},{opacity:0}], {duration:D(DUR.fast), easing:E_STD, fill:'forwards'});
  sheet.animate([{opacity:1},{opacity:0}], {duration:D(DUR.fast), easing:E_STD, fill:'forwards'});
  let ended = false, sh = null;
  const end = () => {
    if (ended || nav !== my) return; ended = true;
    detail.hidden = true;
    navEls().forEach(el => el.getAnimations().forEach(a => a.cancel()));
    if (sh) sh.remove();
    feed.style.willChange = ''; sheet.style.willChange = '';
  };
  if (onScreen) {
    sh = makeShell();
    sh.animate([
      Object.assign(rel(s, st), {borderRadius:'40px 40px 0 0', opacity:1}),
      Object.assign(rel(c, st), {borderRadius:'40px', opacity:1, offset:.75}),
      Object.assign(rel(c, st), {borderRadius:'40px', opacity:0})
    ], {duration:D(DUR.emph + 100), easing:EASE, fill:'forwards'}).onfinish = end;
    // the card sits right under the shell: its content fades in as the shell lands
    $('.ci', card).animate([{opacity:0},{opacity:1}], {duration:D(DUR.std), delay:D(DUR.emph - DUR.std + 50), easing:E_STD, fill:'backwards'});
  } else {
    setTimeout(end, D(DUR.std));
  }
  setTimeout(end, D(DUR.emph + 250));   // safety net if an animation gets cancelled
  requestAnimationFrame(() => { if (nav === my) relayout(() => { state.scope = null; applyVis(); }); });
}

$('#backBtn').addEventListener('click', goBack);

/* ---------------- sidebar navigation: Recording ↔ folders ---------------- */
const side = $('.side'), navpill = $('#navpill');
function placePill(instant){
  const on = $('.nav.on', side); if (!on) return;
  const sr = side.getBoundingClientRect(), r = on.getBoundingClientRect();
  navpill.classList.toggle('instant', !!instant);
  Object.assign(navpill.style, {transform:`translate(${r.left - sr.left}px,${r.top - sr.top + side.scrollTop}px)`, width:r.width+'px', height:r.height+'px'});
  if (instant) { void navpill.offsetWidth; navpill.classList.remove('instant'); }
}
function setNav(){
  $$('.nav', side).forEach(b => b.classList.toggle('on', state.folder ? b.dataset.folder === state.folder : b.dataset.nav === 'feed'));
  placePill(false);
}
function exitDetail(){
  // leave a recording instantly when the user jumps to another place in the sidebar
  ++nav; settleNav();
  if (state.tx) closeTx(true);
  detail.hidden = true; feed.classList.remove('away');
  state.view = 'feed'; state.rec = null; state.scope = null;
}
let listTok = 0;
function go(folder){
  if (state.view === 'detail') exitDetail();
  else if (folder === state.folder) return;
  const my = ++listTok;
  clearTimeout(enterT); clearTimeout(leaveT); clearTimeout(scrollT);
  setFocus(null);
  state.folder = folder; state.fscope = !!folder;
  setNav();
  const col = $('.fcol');
  col.getAnimations().forEach(a => a.cancel());
  col.animate([{opacity:1},{opacity:0}], {duration:D(DUR.fast), easing:E_STD, fill:'forwards'}).onfinish = () => {
    if (my !== listTok) return;
    renderFeed(); feed.scrollTop = 0;
    col.getAnimations().forEach(a => a.cancel());
    [$('#fh'), $('.tools'), ...$$('#feedList > *, #feedList .card')].forEach((e, i) => {
      if (e.classList.contains('cards')) return;
      e.animate([{opacity:0, transform:'translateY(8px)'},{opacity:1, transform:'none'}], {duration:D(DUR.std), delay:D(Math.min(i, 8) * 30), easing:E_STD, fill:'backwards'});
    });
  };
  requestAnimationFrame(() => { if (my === listTok) relayout(() => { list.scrollTop = 0; applyVis(); }); });
}
$('#feedBtn').addEventListener('click', () => { if (state.view === 'detail' && !state.folder) goBack(); else go(null); });
$('#folders').addEventListener('click', e => {
  const b = e.target.closest('.nav'); if (!b) return;
  const f = b.dataset.folder;
  if (state.view === 'detail' && state.folder === f) goBack(); else go(f);
});
/* layout switch: list (compact) <-> lagom (cards with the summary) */
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-layout]'); if (!b || b.dataset.layout === state.layout) return;
  clearTimeout(enterT); clearTimeout(leaveT); setFocus(null);
  state.layout = b.dataset.layout;
  $$('#seg button').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  feed.classList.toggle('layout-lagom', state.layout === 'lagom');   // the cards expand/collapse via CSS
  $$('.card .lgw').forEach(e => e.setAttribute('aria-hidden', state.layout !== 'lagom'));
});
/* drag & drop: drag a recording card onto a folder in the sidebar to move it there */
let dragId = null, toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
const dropTarget = e => e.target.closest('.nav[data-folder]');
feed.addEventListener('dragstart', e => {
  const c = e.target.closest('.card'); if (!c) return;
  dragId = c.dataset.rec;
  e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move';
  clearTimeout(enterT); clearTimeout(leaveT); setFocus(null);
  setTimeout(() => c.classList.add('dragging'));          // after the browser has taken its drag image
});
feed.addEventListener('dragend', () => { dragId = null; $$('.card.dragging').forEach(c => c.classList.remove('dragging')); $$('.nav.drop').forEach(n => n.classList.remove('drop')); });
$('#folders').addEventListener('dragover', e => { if (!dragId || !dropTarget(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; dropTarget(e).classList.add('drop'); });
$('#folders').addEventListener('dragleave', e => { const n = dropTarget(e); if (n && !n.contains(e.relatedTarget)) n.classList.remove('drop'); });
$('#folders').addEventListener('drop', e => {
  const n = dropTarget(e); if (!n || !dragId) return;
  e.preventDefault(); n.classList.remove('drop');
  moveRec(dragId, n.dataset.folder);
});
function moveRec(id, folder){
  const r = R[id], label = r.memo ? 'Memo' : r.title;
  if (r.folder === folder) { toast(`${label} is already in ${folder}`); return; }
  r.folder = folder;
  const card = feed.querySelector(`.card[data-rec="${id}"]`);
  let done = false;
  const finish = () => { if (done) return; done = true; renderFeed(); relayout(() => applyVis()); };
  if (card && state.folder && state.folder !== folder) {   // leaving the folder being viewed: collapse the card away first
    const h = card.offsetHeight;
    card.classList.add('leaving');
    card.animate([{height:h+'px', opacity:1},{height:'0px', opacity:0, paddingTop:'0px', paddingBottom:'0px', marginBottom:'-'+getComputedStyle(card.parentNode).rowGap}], {duration:D(200), easing:E_STD, fill:'forwards'}).onfinish = finish;
    setTimeout(finish, D(200) + 80);                          // safety net if the animation never fires (e.g. background tab)
  } else finish();
  toast(`Moved “${label}” to ${folder}`);
}
addEventListener('resize', () => placePill(true));
document.fonts && document.fonts.ready.then(() => placePill(true));
placePill(true);


/* ---------------- transcription ---------------- */
let hitT = 0;
function openTx(s){
  const was = state.tx;
  if (!was) {
    state.tx = true; sheet.classList.add('tx-open');
    if (!state.collapsed) { setCollapsed(true); state.autoCollapsed = true; }
  }
  $$('.cite').forEach(c => c.classList.toggle('on', s != null && +c.dataset.s === s));
  if (s == null) { if (!was) txs.scrollTop = 0; return; }
  const line = txs.querySelector(`.tl[data-s="${s}"]`); if (!line) return;
  const target = line.offsetTop - txs.clientHeight * .22;
  if (!was) txs.scrollTop = Math.max(0, target - 200);  // start close, so the glide is short and readable
  const dist = Math.abs(target - txs.scrollTop);
  setTimeout(() => {
    tween(txs, target, D(was ? Math.min(DUR.emph, DUR.std + dist * .25) : DUR.emph)).then(() => mark(line));
  }, was ? 0 : D(DUR.std));
}
function mark(line){
  $$('.tl.hit').forEach(l => { if (l !== line) l.classList.remove('hit','settle'); });
  clearTimeout(hitT);
  line.classList.remove('settle'); line.classList.add('hit');
  hitT = setTimeout(() => line.classList.add('settle'), 1300);
}
function closeTx(instant){
  if (!state.tx) return;
  state.tx = false;
  if (instant) { sheet.classList.add('notrans'); sheet.classList.remove('tx-open'); void sheet.offsetWidth; sheet.classList.remove('notrans'); }
  else sheet.classList.remove('tx-open');
  $$('.cite.on').forEach(c => c.classList.remove('on'));
  $$('.tl.hit').forEach(l => l.classList.remove('hit','settle'));
  if (state.autoCollapsed && state.collapsed) setCollapsed(false);
  state.autoCollapsed = false;
}
$('#sumIn').addEventListener('click', e => { const c = e.target.closest('.cite'); if (c) openTx(+c.dataset.s); });
$('#txBtn').addEventListener('click', () => openTx(null));
$('#txClose').addEventListener('click', () => closeTx(false));
addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('.ai.open', list)) closeAction(); else if (state.tx) closeTx(false); else goBack(); } });

applyVis();
</script>
